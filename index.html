<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DS Goal</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#172d4d;
}

/* HEADER */

header{
  background:#17365d;
  color:white;
  text-align:center;
  padding:18px 15px 16px;
  border-bottom:4px solid #e0b400;
  position:relative;
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.brand-text{
  text-align:left;
}

.brand h1{
  margin:0;
  font-size:29px;
  font-weight:800;
  letter-spacing:1px;
}

.brand h1 span{
  color:#e0b400;
}

.brand p{
  margin:3px 0 0;
  color:#e0b400;
  font-size:13px;
}

/* STAR FOOTBALL */

.star-ball{
  width:45px;
  height:45px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 18%, #172d4d 0 9%, transparent 10%),
    radial-gradient(circle at 82% 40%, #172d4d 0 9%, transparent 10%),
    radial-gradient(circle at 68% 78%, #172d4d 0 9%, transparent 10%),
    radial-gradient(circle at 30% 78%, #172d4d 0 9%, transparent 10%),
    radial-gradient(circle at 18% 40%, #172d4d 0 9%, transparent 10%),
    white;

  border:2px solid #d8d8d8;
  position:relative;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.star-ball:after{
  content:"★";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#172d4d;
  font-size:17px;
}

/* HEADER BUTTONS */

.header-tools{
  position:absolute;
  right:15px;
  top:28px;
  display:flex;
  gap:12px;
}

.header-tools button{
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  cursor:pointer;
}

/* MAIN */

.container{
  max-width:760px;
  margin:auto;
  padding:14px;
  padding-bottom:85px;
}

/* SEARCH */

.search-box{
  display:none;
  margin-bottom:12px;
}

.search-box input{
  width:100%;
  padding:13px 15px;
  border:1px solid #d8dde5;
  border-radius:12px;
  background:white;
  color:#172d4d;
  font-size:15px;
  outline:none;
}

/* DATE */

.date-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:8px 0 14px;
}

.date-button{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#17365d;
  color:white;
  font-size:27px;
}

.today{
  font-size:20px;
  font-weight:bold;
  color:#17365d;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.tab{
  flex:1;
  padding:13px 5px;
  border:0;
  border-radius:25px;
  background:#e4e9f0;
  color:#17365d;
  font-size:14px;
  font-weight:bold;
}

.tab.active{
  background:#e0b400;
  color:#17365d;
}

/* STATUS */

.status{
  background:white;
  border-left:5px solid #e0b400;
  border-radius:12px;
  padding:14px;
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

/* LEAGUE */

.league-card{
  background:white;
  border-radius:13px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.09);
}

.league-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 14px;
  background:#17365d;
  color:white;
}

.league-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.league-logo{
  width:30px;
  height:30px;
  object-fit:contain;
}

.league-arrow{
  color:#e0b400;
  font-size:20px;
}

/* MATCH */

.match{
  display:grid;
  grid-template-columns:52px 1fr 65px 1fr;
  align-items:center;
  min-height:76px;
  padding:9px 10px;
  border-bottom:1px solid #edf0f4;
}

.match:last-child{
  border-bottom:0;
}

.match-time{
  text-align:center;
  font-size:12px;
  color:#777;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
}

.home{
  justify-content:flex-end;
  text-align:right;
}

.away{
  justify-content:flex-start;
}

.team-logo{
  width:27px;
  height:27px;
  object-fit:contain;
  flex-shrink:0;
}

.score{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#17365d;
}

.live-score{
  color:#16a34a;
}

.live{
  display:block;
  color:#16a34a;
  font-size:9px;
  margin-top:3px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:55px 15px;
  color:#68778a;
}

.empty-ball{
  margin:0 auto 15px;
  width:65px;
  height:65px;
  transform:scale(1.2);
}

.empty-text{
  font-size:16px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:67px;
  background:#17365d;
  border-top:3px solid #e0b400;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav-item{
  text-align:center;
  color:#aeb9c8;
  font-size:12px;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#e0b400;
}

/* MOBILE */

@media(max-width:480px){

  .brand h1{
    font-size:27px;
  }

  .brand-text{
    text-align:left;
  }

  .header-tools{
    right:9px;
  }

  .match{
    grid-template-columns:45px 1fr 58px 1fr;
  }

  .team{
    font-size:11px;
  }

  .team-logo{
    width:24px;
    height:24px;
  }

  .score{
    font-size:16px;
  }
}

</style>
</head>


<body>


<!-- HEADER -->

<header>

  <div class="brand">

    <div class="star-ball"></div>

    <div class="brand-text">
      <h1>DS <span>GOAL</span></h1>
      <p>Live Football Scores</p>
    </div>

  </div>

  <div class="header-tools">

    <button onclick="toggleSearch()">⌕</button>

    <button onclick="refreshCurrent()">↻</button>

  </div>

</header>



<div class="container">


  <!-- SEARCH -->

  <div class="search-box" id="searchBox">

    <input
      id="searchInput"
      type="text"
      placeholder="Search team..."
      oninput="filterMatches()"
    >

  </div>



  <!-- DATE -->

  <div class="date-bar">

    <button class="date-button">‹</button>

    <div class="today">
      📅 Today
    </div>

    <button class="date-button">›</button>

  </div>



  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      id="liveTab"
      onclick="showTab('live')">
      ● Live
    </button>

    <button
      class="tab"
      id="upcomingTab"
      onclick="showTab('upcoming')">
      Upcoming
    </button>

    <button
      class="tab"
      id="finishedTab"
      onclick="showTab('finished')">
      Finished
    </button>

  </div>



  <!-- STATUS -->

  <div class="status" id="status">
    Loading live matches...
  </div>



  <!-- MATCHES -->

  <div id="matches"></div>


</div>



<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">⚽</span>
    Matches
  </div>

  <div class="nav-item">
    <span class="nav-icon">🏆</span>
    Leagues
  </div>

  <div class="nav-item">
    <span class="nav-icon">📰</span>
    News
  </div>

</div>



<script>


const LIVE_URL =
"https://football-livescore-backend.vercel.app/api/football";


const UPCOMING_URL =
"https://football-livescore-backend.vercel.app/api/upcoming";


let currentTab = "live";

let allMatches = [];



/* LOAD LIVE */

async function loadLive(){

  const status =
    document.getElementById("status");

  const matches =
    document.getElementById("matches");


  status.textContent =
    "Loading live matches...";


  try{

    const response =
      await fetch(LIVE_URL);


    const data =
      await response.json();


    if(
      !data.response ||
      data.response.length === 0
    ){

      allMatches = [];

      status.textContent =
        "No live matches right now.";

      showEmpty(
        "No live matches right now."
      );

      return;
    }


    allMatches =
      data.response;


    status.textContent =
      allMatches.length +
      " live match" +
      (allMatches.length === 1 ? "" : "es");


    displayMatches(allMatches);


  }catch(error){

    console.log(error);

    status.textContent =
      "Unable to load live scores.";

    showEmpty(
      "Unable to load live scores."
    );

  }

}



/* LOAD UPCOMING */

async function loadUpcoming(){

  const status =
    document.getElementById("status");

  status.textContent =
    "Loading upcoming matches...";


  document.getElementById("matches")
    .innerHTML = "";


  try{

    const response =
      await fetch(UPCOMING_URL);


    const data =
      await response.json();


    if(
      !data.response ||
      data.response.length === 0
    ){

      status.textContent =
        "No upcoming matches available.";

      showEmpty(
        "No upcoming matches available."
      );

      return;
    }


    allMatches =
      data.response;


    status.textContent =
      allMatches.length +
      " upcoming match" +
      (allMatches.length === 1 ? "" : "es");


    displayMatches(allMatches);


  }catch(error){

    console.log(error);

    status.textContent =
      "Unable to load upcoming matches.";

    showEmpty(
      "Unable to load upcoming matches."
    );

  }

}



/* GROUP BY LEAGUE */

function displayMatches(matches){

  const container =
    document.getElementById("matches");


  container.innerHTML = "";


  const groups = {};


  matches.forEach(match => {

    const leagueId =
      match.league.id;


    if(!groups[leagueId]){

      groups[leagueId] = {

        name:
          match.league.name,

        logo:
          match.league.logo,

        matches:[]

      };

    }


    groups[leagueId]
      .matches
      .push(match);

  });



  Object.values(groups).forEach(league => {


    const card =
      document.createElement("div");

    card.className =
      "league-card";



    const header =
      document.createElement("div");

    header.className =
      "league-header";


    header.innerHTML = `

      <div class="league-title">

        ${
          league.logo
          ?
          `<img
             class="league-logo"
             src="${league.logo}"
             alt=""
           >`
          :
          `🏆`
        }

        <span>
          ${league.name}
        </span>

      </div>

      <div class="league-arrow">
        ⌃
      </div>

    `;



    const content =
      document.createElement("div");



    league.matches.forEach(match => {


      const home =
        match.teams.home;


      const away =
        match.teams.away;


      const homeScore =
        match.goals.home;


      const awayScore =
        match.goals.away;


      const elapsed =
        match.fixture.status.elapsed;



      let timeText = "";


      if(
        currentTab === "live" &&
        elapsed
      ){

        timeText =
          elapsed + "'";

      }



      if(
        currentTab === "upcoming"
      ){

        const date =
          new Date(
            match.fixture.date
          );

        timeText =
          date.toLocaleTimeString(
            [],
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          );

      }



      const row =
        document.createElement("div");

      row.className =
        "match";


      row.innerHTML = `

        <div class="match-time">
          ${timeText}
        </div>


        <div class="team home">

          <span>
            ${home.name}
          </span>

          ${
            home.logo
            ?
            `<img
               class="team-logo"
               src="${home.logo}"
               alt=""
             >`
            :
            ""
          }

        </div>


        <div class="
          score
          ${currentTab === "live"
            ? "live-score"
            : ""}
        ">

          ${
            currentTab === "upcoming"
            ?
            "vs"
            :
            `${homeScore ?? 0}
             -
             ${awayScore ?? 0}`
          }


          ${
            currentTab === "live" && elapsed
            ?
            `<span class="live">
               LIVE
             </span>`
            :
            ""
          }

        </div>


        <div class="team away">

          ${
            away.logo
            ?
            `<img
               class="team-logo"
               src="${away.logo}"
               alt=""
             >`
            :
            ""
          }

          <span>
            ${away.name}
          </span>

        </div>

      `;


      content.appendChild(row);

    });



    header.onclick =
      function(){

        if(
          content.style.display ===
          "none"
        ){

          content.style.display =
            "block";

          header
            .querySelector(
              ".league-arrow"
            )
            .textContent = "⌃";

        }else{

          content.style.display =
            "none";

          header
            .querySelector(
              ".league-arrow"
            )
            .textContent = "⌄";

        }

      };



    card.appendChild(header);

    card.appendChild(content);

    container.appendChild(card);

  });

}



/* EMPTY */

function showEmpty(message){

  document.getElementById("matches")
    .innerHTML = `

      <div class="empty">

        <div class="empty-ball star-ball"></div>

        <div class="empty-text">
          ${message}
        </div>

      </div>

    `;

}



/* TABS */

function showTab(tab){

  currentTab =
    tab;


  document
    .getElementById("liveTab")
    .classList.remove("active");


  document
    .getElementById("upcomingTab")
    .classList.remove("active");


  document
    .getElementById("finishedTab")
    .classList.remove("active");


  document
    .getElementById(tab + "Tab")
    .classList.add("active");



  if(tab === "live"){

    loadLive();

  }

  else if(tab === "upcoming"){

    loadUpcoming();

  }

  else{

    document.getElementById("status")
      .textContent =
      "Finished matches are not connected yet.";

    showEmpty(
      "Finished matches will be connected to real data."
    );

  }

}



/* SEARCH */

function toggleSearch(){

  const box =
    document.getElementById("searchBox");


  if(
    box.style.display === "block"
  ){

    box.style.display =
      "none";

  }else{

    box.style.display =
      "block";

    document
      .getElementById("searchInput")
      .focus();

  }

}



/* FILTER */

function filterMatches(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  const filtered =
    allMatches.filter(match => {

      const home =
        match.teams.home.name
          .toLowerCase();


      const away =
        match.teams.away.name
          .toLowerCase();


      return(
        home.includes(search) ||
        away.includes(search)
      );

    });


  displayMatches(filtered);

}



/* REFRESH */

function refreshCurrent(){

  if(currentTab === "live"){

    loadLive();

  }

  else if(currentTab === "upcoming"){

    loadUpcoming();

  }

}



/* START */

loadLive();


/* AUTO REFRESH */

setInterval(function(){

  if(currentTab === "live"){

    loadLive();

  }

},60000);


</script>

</body>
</html>
