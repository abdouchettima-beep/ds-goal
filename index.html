<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DS GOAL</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #111827;
  padding-bottom: 75px;
}

/* ================= HEADER ================= */

header {
  background: #071a3d;
  color: white;
  text-align: center;
  padding: 8px 15px 12px;
  border-bottom: 4px solid #d4af37;
  position: relative;
}

/* Champions League style football */

.cl-ball {
  width: 58px;
  height: 58px;
  margin: 0 auto 3px;
  border-radius: 50%;
  background: white;
  border: 2px solid #b8b8b8;
  position: relative;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  overflow: hidden;
}

.cl-ball span {
  position: absolute;
  color: #071a3d;
  font-size: 18px;
  line-height: 18px;
}

.cl-ball span:nth-child(1) {
  top: 3px;
  left: 20px;
}

.cl-ball span:nth-child(2) {
  top: 18px;
  left: 3px;
}

.cl-ball span:nth-child(3) {
  top: 18px;
  right: 3px;
}

.cl-ball span:nth-child(4) {
  bottom: 3px;
  left: 10px;
}

.cl-ball span:nth-child(5) {
  bottom: 3px;
  right: 10px;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo span {
  color: #d4af37;
}

.subtitle {
  font-size: 12px;
  margin-top: 3px;
  color: #dddddd;
}

.header-button {
  position: absolute;
  top: 82px;
  background: transparent;
  border: none;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.search-btn {
  left: 15px;
}

.refresh-btn {
  right: 15px;
}

/* ================= MAIN ================= */

main {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* ================= DATE ================= */

.date-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0 18px;
}

/* ================= TABS ================= */

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  border: 2px solid #d4af37;
  background: white;
  color: #071a3d;
  padding: 9px 18px;
  border-radius: 22px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.tab.active {
  background: #d4af37;
  color: #071a3d;
}

/* ================= STATUS ================= */

.status {
  text-align: center;
  border: 2px solid #d4af37;
  border-radius: 12px;
  padding: 14px 10px;
  margin-bottom: 18px;
  color: #071a3d;
  font-weight: bold;
  font-size: 16px;
}

/* ================= EMPTY STAR FOOTBALL ================= */

.empty-football {
  width: 145px;
  height: 145px;
  margin: 35px auto;
  border-radius: 50%;
  background: white;
  border: 4px solid #d4af37;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  position: relative;
}

.empty-football .star {
  position: absolute;
  color: #071a3d;
  font-size: 42px;
  line-height: 42px;
}

.empty-football .s1 {
  top: 10px;
  left: 51px;
}

.empty-football .s2 {
  top: 48px;
  left: 8px;
}

.empty-football .s3 {
  top: 48px;
  right: 8px;
}

.empty-football .s4 {
  bottom: 12px;
  left: 28px;
}

.empty-football .s5 {
  bottom: 12px;
  right: 28px;
}

/* ================= LEAGUE GROUP ================= */

.league-group {
  margin-bottom: 18px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  overflow: hidden;
  background: white;
}

.league-header {
  background: #071a3d;
  color: white;
  padding: 11px 13px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.league-name {
  display: flex;
  align-items: center;
  gap: 8px;
}

.league-logo {
  width: 27px;
  height: 27px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
}

/* ================= MATCH ================= */

.match {
  padding: 12px;
  border-bottom: 1px solid #eeeeee;
}

.match:last-child {
  border-bottom: none;
}

.match-time {
  text-align: center;
  color: #d4af37;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 7px;
}

.team-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 7px 0;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 85%;
}

.team img {
  width: 27px;
  height: 27px;
  object-fit: contain;
}

.score {
  font-weight: bold;
  font-size: 17px;
  color: #071a3d;
}

/* ================= LEAGUES PAGE ================= */

.search-box {
  width: 100%;
  padding: 12px;
  border: 1px solid #cccccc;
  border-radius: 9px;
  margin-bottom: 15px;
  font-size: 15px;
  outline: none;
}

.search-box:focus {
  border-color: #d4af37;
}

.league-card {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 9px;
  background: white;
  cursor: pointer;
}

.league-card img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.league-card-info {
  flex: 1;
}

.league-card-name {
  font-weight: bold;
  color: #071a3d;
}

.league-country {
  font-size: 12px;
  color: #777777;
  margin-top: 3px;
}

.arrow {
  font-size: 24px;
  color: #d4af37;
}

/* ================= NEWS ================= */

.news-empty {
  text-align: center;
  margin-top: 60px;
  color: #777777;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #071a3d;
  border-top: 3px solid #d4af37;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-button {
  background: none;
  border: none;
  color: white;
  font-size: 12px;
  cursor: pointer;
  text-align: center;
}

.nav-icon {
  display: block;
  font-size: 23px;
  margin-bottom: 3px;
}

.nav-button.active {
  color: #d4af37;
}

/* ================= LOADING ================= */

.loading {
  text-align: center;
  padding: 25px;
  color: #777777;
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .logo {
    font-size: 25px;
  }

  .tab {
    padding: 8px 14px;
    font-size: 13px;
  }

  .header-button {
    top: 80px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="cl-ball">
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
  </div>

  <div class="logo">
    DS <span>GOAL</span>
  </div>

  <div class="subtitle">
    Live Football Scores
  </div>

  <button class="header-button search-btn" onclick="showSearch()">
    ⌕
  </button>

  <button class="header-button refresh-btn" onclick="loadMatches()">
    ↻
  </button>

</header>


<!-- ================= MAIN ================= -->

<main>

  <!-- MATCHES -->

  <section id="matchesPage" class="page active">

    <div class="date-title">
      Today
    </div>

    <div class="tabs">

      <button
        class="tab active"
        onclick="changeTab('live', this)">
        Live
      </button>

      <button
        class="tab"
        onclick="changeTab('upcoming', this)">
        Upcoming
      </button>

      <button
        class="tab"
        onclick="changeTab('finished', this)">
        Finished
      </button>

    </div>

    <div id="matchStatus" class="status">
      Loading matches...
    </div>

    <div id="matchesContainer"></div>

  </section>


  <!-- LEAGUES -->

  <section id="leaguesPage" class="page">

    <div class="date-title">
      All Competitions
    </div>

    <input
      id="leagueSearch"
      class="search-box"
      type="text"
      placeholder="Search leagues..."
      oninput="filterLeagues()"
    >

    <div id="leaguesContainer">

      <div class="loading">
        Loading competitions...
      </div>

    </div>

  </section>


  <!-- NEWS -->

  <section id="newsPage" class="page">

    <div class="date-title">
      Football News
    </div>

    <div class="news-empty">
      News section coming soon.
    </div>

  </section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    onclick="showPage('matchesPage', this)">

    <span class="nav-icon">⚽</span>
    Matches

  </button>


  <button
    class="nav-button"
    onclick="showPage('leaguesPage', this)">

    <span class="nav-icon">🏆</span>
    Leagues

  </button>


  <button
    class="nav-button"
    onclick="showPage('newsPage', this)">

    <span class="nav-icon">📰</span>
    News

  </button>

</nav>


<script>

const BACKEND =
"https://football-livescore-backend.vercel.app";

let currentTab = "live";

let allLeagues = [];


/* ================= PAGE NAVIGATION ================= */

function showPage(pageId, button) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll(".nav-button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  if (
    pageId === "leaguesPage" &&
    allLeagues.length === 0
  ) {
    loadLeagues();
  }

}


/* ================= MATCH TABS ================= */

function changeTab(tab, button) {

  currentTab = tab;

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  if (tab === "live") {
    loadLive();
  }

  if (tab === "upcoming") {
    loadUpcoming();
  }

  if (tab === "finished") {
    loadFinished();
  }

}


/* ================= LIVE ================= */

async function loadLive() {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");

  status.textContent =
    "Loading live matches...";

  container.innerHTML = "";

  try {

    const response =
      await fetch(BACKEND + "/api/football");

    const data =
      await response.json();

    if (
      !data.response ||
      data.response.length === 0
    ) {

      showEmpty(
        "No live matches right now."
      );

      return;
    }

    displayMatches(data.response);

  } catch (error) {

    status.textContent =
      "Unable to load live matches.";

    container.innerHTML = "";

  }

}


/* ================= UPCOMING ================= */

async function loadUpcoming() {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");

  status.textContent =
    "Loading upcoming matches...";

  container.innerHTML = "";

  try {

    const response =
      await fetch(BACKEND + "/api/upcoming");

    const data =
      await response.json();

    if (
      !data.response ||
      data.response.length === 0
    ) {

      showEmpty(
        "No upcoming matches found."
      );

      return;
    }

    displayMatches(data.response);

  } catch (error) {

    status.textContent =
      "Unable to load upcoming matches.";

    container.innerHTML = "";

  }

}


/* ================= FINISHED ================= */

async function loadFinished() {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");

  status.textContent =
    "Finished matches will be connected next.";

  container.innerHTML = "";

}


/* ================= DISPLAY MATCHES ================= */

function displayMatches(matches) {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");

  status.textContent =
    matches.length + " matches";

  container.innerHTML = "";

  const groups = {};


  matches.forEach(match => {

    const league =
      match.league?.name ||
      "Other Competitions";

    if (!groups[league]) {

      groups[league] = {

        logo:
          match.league?.logo || "",

        matches: []

      };

    }

    groups[league].matches.push(match);

  });


  Object.keys(groups).forEach(leagueName => {

    const group =
      groups[leagueName];

    const leagueBox =
      document.createElement("div");

    leagueBox.className =
      "league-group";


    leagueBox.innerHTML = `

      <div class="league-header">

        <div class="league-name">

          ${
            group.logo

            ? `<img
                class="league-logo"
                src="${group.logo}"
              >`

            : ""
          }

          ${leagueName}

        </div>

        <span>
          ${group.matches.length}
        </span>

      </div>

    `;


    group.matches.forEach(match => {

      const home =
        match.teams?.home?.name ||
        "Home";

      const away =
        match.teams?.away?.name ||
        "Away";

      const homeLogo =
        match.teams?.home?.logo ||
        "";

      const awayLogo =
        match.teams?.away?.logo ||
        "";

      const homeScore =
        match.goals?.home ?? "-";

      const awayScore =
        match.goals?.away ?? "-";


      const time =
        match.fixture?.date

        ? new Date(
            match.fixture.date
          ).toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

        : "";


      const matchBox =
        document.createElement("div");

      matchBox.className =
        "match";


      matchBox.innerHTML = `

        <div class="match-time">
          ${time}
        </div>

        <div class="team-row">

          <div class="team">

            ${
              homeLogo

              ? `<img src="${homeLogo}">`

              : ""
            }

            <span>
              ${home}
            </span>

          </div>

          <span class="score">
            ${homeScore}
          </span>

        </div>


        <div class="team-row">

          <div class="team">

            ${
              awayLogo

              ? `<img src="${awayLogo}">`

              : ""
            }

            <span>
              ${away}
            </span>

          </div>

          <span class="score">
            ${awayScore}
          </span>

        </div>

      `;


      leagueBox.appendChild(matchBox);

    });


    container.appendChild(leagueBox);

  });

}


/* ================= EMPTY STATE ================= */

function showEmpty(message) {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");

  status.textContent =
    message;


  container.innerHTML = `

    <div class="empty-football">

      <span class="star s1">★</span>
      <span class="star s2">★</span>
      <span class="star s3">★</span>
      <span class="star s4">★</span>
      <span class="star s5">★</span>

    </div>

  `;

}


/* ================= LOAD LEAGUES ================= */

async function loadLeagues() {

  const container =
    document.getElementById("leaguesContainer");

  container.innerHTML =
    '<div class="loading">Loading competitions...</div>';


  try {

    const response =
      await fetch(BACKEND + "/api/leagues");

    const data =
      await response.json();


    if (!data.response) {

      container.innerHTML =
        '<div class="loading">Unable to load competitions.</div>';

      return;

    }


    allLeagues =
      data.response;

    displayLeagues(allLeagues);


  } catch (error) {

    container.innerHTML =
      '<div class="loading">Unable to load competitions.</div>';

  }

}


/* ================= DISPLAY LEAGUES ================= */

function displayLeagues(leagues) {

  const container =
    document.getElementById("leaguesContainer");

  container.innerHTML = "";


  leagues.forEach(item => {

    const league =
      item.league;

    const country =
      item.country;


    if (!league) return;


    const card =
      document.createElement("div");

    card.className =
      "league-card";


    card.innerHTML = `

      ${
        league.logo

        ? `<img src="${league.logo}">`

        : `<div
             style="
             width:40px;
             height:40px;
             font-size:32px;">
             🏆
           </div>`
      }


      <div class="league-card-info">

        <div class="league-card-name">

          ${
            league.name ||
            "Unknown Competition"
          }

        </div>


        <div class="league-country">

          ${
            country?.name || ""
          }

        </div>

      </div>


      <div class="arrow">
        ›
      </div>

    `;


    container.appendChild(card);

  });

}


/* ================= SEARCH LEAGUES ================= */

function filterLeagues() {

  const search =
    document
      .getElementById("leagueSearch")
      .value
      .toLowerCase();


  const filtered =
    allLeagues.filter(item => {

      const name =
        item.league?.name
          ?.toLowerCase() || "";

      const country =
        item.country?.name
          ?.toLowerCase() || "";


      return (
        name.includes(search) ||
        country.includes(search)
      );

    });


  displayLeagues(filtered);

}


/* ================= SEARCH BUTTON ================= */

function showSearch() {

  if (
    document
      .getElementById("matchesPage")
      .classList
      .contains("active")
  ) {

    alert(
      "Match search will be added next."
    );

  } else {

    document
      .getElementById("leagueSearch")
      .focus();

  }

}


/* ================= REFRESH ================= */

function loadMatches() {

  if (currentTab === "live") {
    loadLive();
  }

  if (currentTab === "upcoming") {
    loadUpcoming();
  }

  if (currentTab === "finished") {
    loadFinished();
  }

}


/* ================= START ================= */

loadLive();

</script>

</body>
</html>
