<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DS GOAL</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #071a3d;
  padding-bottom: 75px;
}

/* ================= HEADER ================= */

header {
  background: #071a3d;
  color: white;
  text-align: center;
  padding: 9px 15px 13px;
  border-bottom: 4px solid #d4af37;
  position: relative;
}

.cl-ball {
  width: 55px;
  height: 55px;
  margin: 0 auto 4px;
  border-radius: 50%;
  background: white;
  border: 2px solid #c9c9c9;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
}

.cl-ball span {
  position: absolute;
  color: #071a3d;
  font-size: 18px;
}

.cl-ball span:nth-child(1) {
  top: 3px;
  left: 19px;
}

.cl-ball span:nth-child(2) {
  top: 17px;
  left: 3px;
}

.cl-ball span:nth-child(3) {
  top: 17px;
  right: 3px;
}

.cl-ball span:nth-child(4) {
  bottom: 3px;
  left: 10px;
}

.cl-ball span:nth-child(5) {
  bottom: 3px;
  right: 10px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo span {
  color: #d4af37;
}

.subtitle {
  font-size: 12px;
  color: #dddddd;
  margin-top: 3px;
}

.header-button {
  position: absolute;
  top: 77px;
  border: none;
  background: transparent;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.search-btn {
  left: 16px;
}

.refresh-btn {
  right: 16px;
}

/* ================= MAIN ================= */

main {
  max-width: 700px;
  margin: auto;
  padding: 14px;
}

/* ================= DATE BAR ================= */

.date-wrapper {
  margin: 8px -14px 14px;
  overflow-x: auto;
  white-space: nowrap;
  border-bottom: 1px solid #eeeeee;
  scrollbar-width: none;
}

.date-wrapper::-webkit-scrollbar {
  display: none;
}

.date-bar {
  display: inline-flex;
  align-items: stretch;
  gap: 4px;
  padding: 4px 10px 0;
  min-width: 100%;
}

.date-item {
  border: none;
  background: white;
  color: #071a3d;
  min-width: 72px;
  padding: 9px 7px 11px;
  cursor: pointer;
  font-weight: bold;
  font-size: 12px;
  border-bottom: 3px solid transparent;
}

.date-item .day {
  display: block;
  font-size: 11px;
  color: #777777;
  margin-bottom: 3px;
}

.date-item .date-number {
  display: block;
  font-size: 14px;
}

.date-item.today-date {
  color: #071a3d;
}

.date-item.active {
  color: #071a3d;
  border-bottom-color: #d4af37;
}

.date-item.active .day {
  color: #071a3d;
}

/* ================= STATUS TABS ================= */

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 1;
  min-width: 80px;
  border: 1px solid #d4af37;
  background: white;
  color: #071a3d;
  padding: 10px 8px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: #d4af37;
  color: #071a3d;
}

/* ================= LEAGUE DROPDOWN ================= */

.league-filter {
  position: relative;
  margin-bottom: 15px;
}

.league-select {
  width: 100%;
  padding: 13px 40px 13px 14px;
  border: 2px solid #d4af37;
  border-radius: 10px;
  background: white;
  color: #071a3d;
  font-size: 15px;
  font-weight: bold;
  appearance: none;
  outline: none;
}

.league-filter::after {
  content: "▼";
  position: absolute;
  right: 15px;
  top: 13px;
  color: #d4af37;
  pointer-events: none;
}

/* ================= STATUS MESSAGE ================= */

.status {
  text-align: center;
  border: 2px solid #d4af37;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  font-weight: bold;
  font-size: 14px;
}

/* ================= MATCH GROUP ================= */

.league-group {
  border: 1px solid #dddddd;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 15px;
  background: white;
}

.league-header {
  background: #071a3d;
  color: white;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.league-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  font-size: 14px;
}

.league-logo {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: white;
  object-fit: contain;
}

.league-count {
  background: #d4af37;
  color: #071a3d;
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}

/* ================= MATCH ================= */

.match {
  padding: 12px 10px;
  border-bottom: 1px solid #eeeeee;
}

.match:last-child {
  border-bottom: none;
}

.match-status {
  text-align: center;
  font-size: 11px;
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 7px;
}

.match-status.live {
  color: #d00000;
}

.match-status.finished {
  color: #777777;
}

.team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 7px 0;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 78%;
}

.team img {
  width: 27px;
  height: 27px;
  object-fit: contain;
}

.team-name {
  font-size: 14px;
}

.score {
  font-size: 16px;
  font-weight: bold;
  min-width: 25px;
  text-align: center;
}

.match-meta {
  text-align: center;
  font-size: 10px;
  color: #888888;
  margin-top: 4px;
}

/* ================= EMPTY ================= */

.empty-state {
  text-align: center;
  padding: 35px 15px;
}

.empty-ball {
  width: 125px;
  height: 125px;
  margin: 0 auto 20px;
  border-radius: 50%;
  border: 4px solid #d4af37;
  background: white;
  position: relative;
}

.empty-ball span {
  position: absolute;
  color: #071a3d;
  font-size: 35px;
}

.empty-ball .s1 {
  top: 8px;
  left: 43px;
}

.empty-ball .s2 {
  top: 43px;
  left: 7px;
}

.empty-ball .s3 {
  top: 43px;
  right: 7px;
}

.empty-ball .s4 {
  bottom: 8px;
  left: 25px;
}

.empty-ball .s5 {
  bottom: 8px;
  right: 25px;
}

.empty-text {
  color: #777777;
  font-size: 14px;
}

/* ================= LEAGUES PAGE ================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin: 10px 0 16px;
}

.league-search {
  width: 100%;
  padding: 12px;
  border: 1px solid #cccccc;
  border-radius: 9px;
  margin-bottom: 12px;
  font-size: 15px;
  outline: none;
}

.competition-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  margin-bottom: 8px;
  background: white;
}

.competition-card img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.competition-info {
  flex: 1;
}

.competition-name {
  font-weight: bold;
  color: #071a3d;
}

.competition-country {
  font-size: 12px;
  color: #777777;
  margin-top: 3px;
}

.arrow {
  color: #d4af37;
  font-size: 23px;
}

/* ================= NEWS ================= */

.news-empty {
  text-align: center;
  color: #777777;
  padding: 60px 20px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #071a3d;
  border-top: 3px solid #d4af37;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-button {
  border: none;
  background: none;
  color: white;
  font-size: 12px;
  text-align: center;
  cursor: pointer;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-button.active {
  color: #d4af37;
}

/* ================= LOADING ================= */

.loading {
  text-align: center;
  padding: 30px;
  color: #777777;
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .tabs {
    gap: 6px;
  }

  .tab {
    font-size: 13px;
    padding: 9px 6px;
  }

  .logo {
    font-size: 25px;
  }

  .date-item {
    min-width: 68px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="cl-ball">
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
  </div>

  <div class="logo">
    DS <span>GOAL</span>
  </div>

  <div class="subtitle">
    Live Football Scores
  </div>

  <button class="header-button search-btn" onclick="openSearch()">
    ⌕
  </button>

  <button class="header-button refresh-btn" onclick="refreshCurrentPage()">
    ↻
  </button>

</header>


<main>

<!-- ================= MATCHES PAGE ================= -->

<section id="matchesPage" class="page active">

  <!-- DATE BAR -->

  <div class="date-wrapper" id="dateWrapper">
    <div class="date-bar" id="dateBar"></div>
  </div>


  <!-- STATUS FILTER -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="changeTab('all', this)">
      All
    </button>

    <button
      class="tab"
      onclick="changeTab('live', this)">
      Live
    </button>

    <button
      class="tab"
      onclick="changeTab('upcoming', this)">
      Upcoming
    </button>

    <button
      class="tab"
      onclick="changeTab('finished', this)">
      Finished
    </button>

  </div>


  <!-- LEAGUE FILTER -->

  <div class="league-filter">

    <select
      id="leagueSelect"
      class="league-select"
      onchange="filterMatchesByLeague()">

      <option value="all">
        All Leagues
      </option>

    </select>

  </div>


  <div id="matchStatus" class="status">
    Loading matches...
  </div>


  <div id="matchesContainer"></div>

</section>


<!-- ================= LEAGUES PAGE ================= -->

<section id="leaguesPage" class="page">

  <div class="page-title">
    All Competitions
  </div>

  <input
    id="leagueSearch"
    class="league-search"
    type="text"
    placeholder="Search leagues or countries..."
    oninput="filterLeagueCatalogue()"
  >

  <div id="leaguesContainer">

    <div class="loading">
      Loading competitions...
    </div>

  </div>

</section>


<!-- ================= NEWS PAGE ================= -->

<section id="newsPage" class="page">

  <div class="page-title">
    Football News
  </div>

  <div class="news-empty">
    News section coming soon.
  </div>

</section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    onclick="showPage('matchesPage', this)">

    <span class="nav-icon">⚽</span>
    Matches

  </button>


  <button
    class="nav-button"
    onclick="showPage('leaguesPage', this)">

    <span class="nav-icon">🏆</span>
    Leagues

  </button>


  <button
    class="nav-button"
    onclick="showPage('newsPage', this)">

    <span class="nav-icon">📰</span>
    News

  </button>

</nav>


<script>

/* ================= BACKEND ================= */

const BACKEND =
"https://football-livescore-backend.vercel.app";


/* ================= VARIABLES ================= */

let currentTab = "all";

let selectedLeague = "all";

let allMatches = [];

let allLeagues = [];

let selectedDate = new Date();


/* ================= DATE HELPERS ================= */

function formatDateForAPI(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function getDayName(date) {

  return date.toLocaleDateString(
    "en-US",
    {
      weekday: "short"
    }
  ).toUpperCase();

}


function isToday(date) {

  const today = new Date();

  return (
    date.getFullYear() === today.getFullYear() &&
    date.getMonth() === today.getMonth() &&
    date.getDate() === today.getDate()
  );

}


/* ================= DATE BAR ================= */

function createDateBar() {

  const dateBar =
    document.getElementById("dateBar");

  dateBar.innerHTML = "";

  const today =
    new Date();

  /*
    Show today plus the next 6 days.
  */

  for (let i = 0; i < 7; i++) {

    const date =
      new Date(today);

    date.setDate(
      today.getDate() + i
    );

    const button =
      document.createElement("button");

    button.className =
      "date-item";

    if (isToday(date)) {

      button.classList.add(
        "today-date"
      );

    }

    if (
      formatDateForAPI(date) ===
      formatDateForAPI(selectedDate)
    ) {

      button.classList.add(
        "active"
      );

    }

    const dayName =
      isToday(date)
      ? "TODAY"
      : getDayName(date);

    const dateNumber =
      date.getDate();

    button.innerHTML = `
      <span class="day">
        ${dayName}
      </span>

      <span class="date-number">
        ${dateNumber}
      </span>
    `;

    button.onclick =
      function() {

        selectedDate =
          new Date(date);

        createDateBar();

        currentTab = "all";

        document
          .querySelectorAll(".tab")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        document
          .querySelector(".tab")
          .classList.add("active");

        selectedLeague = "all";

        document
          .getElementById("leagueSelect")
          .value = "all";

        loadMatches();

      };

    dateBar.appendChild(button);

  }

}


/* ================= PAGE NAVIGATION ================= */

function showPage(pageId, button) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  document
    .querySelectorAll(".nav-button")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add("active");


  if (
    pageId === "leaguesPage" &&
    allLeagues.length === 0
  ) {

    loadLeagues();

  }

}


/* ================= TAB ================= */

function changeTab(tab, button) {

  currentTab =
    tab;

  selectedLeague =
    "all";


  document
    .getElementById("leagueSelect")
    .value = "all";


  document
    .querySelectorAll(".tab")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  displayMatches(
    allMatches
  );

}


/* ================= LOAD MATCHES ================= */

async function loadMatches() {

  const status =
    document.getElementById(
      "matchStatus"
    );

  const container =
    document.getElementById(
      "matchesContainer"
    );


  status.textContent =
    "Loading matches...";

  container.innerHTML =
    `<div class="loading">
       Loading fixtures...
     </div>`;


  try {

    const date =
      formatDateForAPI(
        selectedDate
      );


    const url =
      BACKEND +
      "/api/fixtures?date=" +
      encodeURIComponent(date);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Server returned " +
        response.status
      );

    }


    const data =
      await response.json();


    allMatches =
      Array.isArray(data.response)
      ? data.response
      : [];


    selectedLeague =
      "all";


    updateLeagueDropdown(
      allMatches
    );


    displayMatches(
      allMatches
    );


  } catch (error) {

    console.error(
      "DS GOAL error:",
      error
    );


    status.textContent =
      "Unable to load matches.";


    container.innerHTML = `

      <div class="empty-state">

        <div class="empty-ball">

          <span class="s1">★</span>
          <span class="s2">★</span>
          <span class="s3">★</span>
          <span class="s4">★</span>
          <span class="s5">★</span>

        </div>

        <div class="empty-text">
          Unable to connect to the football server.
        </div>

      </div>

    `;

  }

}


/* ================= STATUS HELPERS ================= */

const LIVE_STATUSES = [
  "1H",
  "2H",
  "ET",
  "BT",
  "P"
];


const FINISHED_STATUSES = [
  "FT",
  "AET",
  "PEN"
];


function getMatchStatus(match) {

  return (
    match.fixture?.status?.short ||
    ""
  );

}


function isLive(match) {

  return LIVE_STATUSES.includes(
    getMatchStatus(match)
  );

}


function isFinished(match) {

  return FINISHED_STATUSES.includes(
    getMatchStatus(match)
  );

}


function isUpcoming(match) {

  const status =
    getMatchStatus(match);

  if (
    LIVE_STATUSES.includes(status)
  ) {

    return false;

  }


  if (
    FINISHED_STATUSES.includes(status)
  ) {

    return false;

  }


  if (
    ["CANC", "ABD", "PST"].includes(status)
  ) {

    return false;

  }


  return true;

}


/* ================= LEAGUE DROPDOWN ================= */

function updateLeagueDropdown(matches) {

  const select =
    document.getElementById(
      "leagueSelect"
    );


  const leagues = {};


  matches.forEach(match => {

    const id =
      match.league?.id;

    const name =
      match.league?.name;


    if (id && name) {

      leagues[id] = {

        name:
          name,

        logo:
          match.league?.logo || ""

      };

    }

  });


  select.innerHTML = `

    <option value="all">
      All Leagues
    </option>

  `;


  Object.keys(leagues)
    .sort((a, b) =>
      leagues[a].name.localeCompare(
        leagues[b].name
      )
    )
    .forEach(id => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        id;


      option.textContent =
        leagues[id].name;


      select.appendChild(
        option
      );

    });


  select.value =
    selectedLeague;

}


/* ================= FILTER MATCHES ================= */

function filterMatchesByLeague() {

  selectedLeague =
    document
      .getElementById(
        "leagueSelect"
      )
      .value;


  displayMatches(
    allMatches
  );

}


/* ================= DISPLAY MATCHES ================= */

function displayMatches(matches) {

  const status =
    document.getElementById(
      "matchStatus"
    );


  const container =
    document.getElementById(
      "matchesContainer"
    );


  let filtered =
    [...matches];


  /* STATUS FILTER */

  if (
    currentTab === "live"
  ) {

    filtered =
      filtered.filter(
        match => isLive(match)
      );

  }


  if (
    currentTab === "upcoming"
  ) {

    filtered =
      filtered.filter(
        match => isUpcoming(match)
      );

  }


  if (
    currentTab === "finished"
  ) {

    filtered =
      filtered.filter(
        match => isFinished(match)
      );

  }


  /* LEAGUE FILTER */

  if (
    selectedLeague !== "all"
  ) {

    filtered =
      filtered.filter(
        match =>
          String(
            match.league?.id
          ) ===
          String(
            selectedLeague
          )
      );

  }


  container.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    status.textContent =
      "No " +
      (
        currentTab === "all"
        ? ""
        : currentTab + " "
      ) +
      "matches found.";


    container.innerHTML = `

      <div class="empty-state">

        <div class="empty-ball">

          <span class="s1">★</span>
          <span class="s2">★</span>
          <span class="s3">★</span>
          <span class="s4">★</span>
          <span class="s5">★</span>

        </div>

        <div class="empty-text">
          No matches found for this selection.
        </div>

      </div>

    `;

    return;

  }


  status.textContent =
    filtered.length +
    " matches";


  /* GROUP BY LEAGUE */

  const groups = {};


  filtered.forEach(match => {

    const id =
      match.league?.id ||
      "other";


    const name =
      match.league?.name ||
      "Other Competitions";


    if (!groups[id]) {

      groups[id] = {

        name:
          name,

        logo:
          match.league?.logo || "",

        matches:
          []

      };

    }


    groups[id].matches.push(
      match
    );

  });


  /* SORT LEAGUES */

  const sortedGroups =
    Object.values(groups)
      .sort((a, b) =>
        a.name.localeCompare(
          b.name
        )
      );


  /* DISPLAY EACH LEAGUE */

  sortedGroups.forEach(
    group => {

      const leagueBox =
        document.createElement(
          "div"
        );


      leagueBox.className =
        "league-group";


      leagueBox.innerHTML = `

        <div class="league-header">

          <div class="league-title">

            ${
              group.logo
              ? `
                <img
                  class="league-logo"
                  src="${escapeHTML(group.logo)}"
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            ${escapeHTML(group.name)}

          </div>

          <div class="league-count">
            ${group.matches.length}
          </div>

        </div>

      `;


      group.matches
        .sort(
          (a, b) =>
            new Date(
              a.fixture?.date || 0
            ) -
            new Date(
              b.fixture?.date || 0
            )
        )
        .forEach(
          match => {

            const matchBox =
              createMatchCard(
                match
              );


            leagueBox.appendChild(
              matchBox
            );

          }
        );


      container.appendChild(
        leagueBox
      );

    }
  );

}


/* ================= MATCH CARD ================= */

function createMatchCard(match) {

  const home =
    match.teams?.home?.name ||
    "Home";


  const away =
    match.teams?.away?.name ||
    "Away";


  const homeLogo =
    match.teams?.home?.logo ||
    "";


  const awayLogo =
    match.teams?.away?.logo ||
    "";


  const homeScore =
    match.goals?.home ??
    "-";


  const awayScore =
    match.goals?.away ??
    "-";


  const statusShort =
    getMatchStatus(match);


  const statusLong =
    match.fixture?.status?.long ||
    "";


  let matchTime =
    "--:--";


  if (
    match.fixture?.date
  ) {

    matchTime =
      new Date(
        match.fixture.date
      ).toLocaleTimeString(
        "en-NG",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Africa/Lagos"
        }
      );

  }


  let statusText =
    matchTime;


  let statusClass =
    "";


  if (
    isLive(match)
  ) {

    const elapsed =
      match.fixture?.status?.elapsed;


    statusText =
      elapsed
      ? "LIVE " + elapsed + "'"
      : "LIVE";


    statusClass =
      "live";

  }


  if (
    isFinished(match)
  ) {

    statusText =
      statusShort === "PEN"
      ? "PENALTIES"
      : "FULL TIME";


    statusClass =
      "finished";

  }


  if (
    statusShort === "HT"
  ) {

    statusText =
      "HALF TIME";


    statusClass =
      "live";

  }


  const matchBox =
    document.createElement(
      "div"
    );


  matchBox.className =
    "match";


  matchBox.innerHTML = `

    <div class="match-status ${statusClass}">
      ${escapeHTML(statusText)}
    </div>


    <div class="team-row">

      <div class="team">

        ${
          homeLogo
          ? `
            <img
              src="${escapeHTML(homeLogo)}"
              alt=""
              onerror="this.style.display='none'"
            >
          `
          : ""
        }

        <span class="team-name">
          ${escapeHTML(home)}
        </span>

      </div>


      <div class="score">
        ${homeScore}
      </div>

    </div>


    <div class="team-row">

      <div class="team">

        ${
          awayLogo
          ? `
            <img
              src="${escapeHTML(awayLogo)}"
              alt=""
              onerror="this.style.display='none'"
            >
          `
          : ""
        }

        <span class="team-name">
          ${escapeHTML(away)}
        </span>

      </div>


      <div class="score">
        ${awayScore}
      </div>

    </div>


    ${
      statusLong
      ? `
        <div class="match-meta">
          ${escapeHTML(statusLong)}
        </div>
      `
      : ""
    }

  `;


  return matchBox;

}


/* ================= SAFE HTML ================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ================= LEAGUES CATALOGUE ================= */

async function loadLeagues() {

  const container =
    document.getElementById(
      "leaguesContainer"
    );


  container.innerHTML =
    `<div class="loading">
       Loading competitions...
     </div>`;


  try {

    const response =
      await fetch(
        BACKEND +
        "/api/leagues"
      );


    if (!response.ok) {

      throw new Error(
        "Unable to load leagues"
      );

    }


    const data =
      await response.json();


    if (
      !Array.isArray(
        data.response
      )
    ) {

      throw new Error(
        "Invalid league response"
      );

    }


    allLeagues =
      data.response;


    displayLeagues(
      allLeagues
    );


  } catch (error) {

    console.error(
      "League error:",
      error
    );


    container.innerHTML =
      `<div class="loading">
        Unable to load competitions.
      </div>`;

  }

}


/* ================= DISPLAY LEAGUES ================= */

function displayLeagues(
  leagues
) {

  const container =
    document.getElementById(
      "leaguesContainer"
    );


  container.innerHTML =
    "";


  if (
    leagues.length === 0
  ) {

    container.innerHTML =
      `<div class="loading">
        No competitions found.
      </div>`;

    return;

  }


  leagues.forEach(
    item => {

      const league =
        item.league;


      const country =
        item.country;


      if (!league) {
        return;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "competition-card";


      card.innerHTML = `

        ${
          league.logo

          ? `
            <img
              src="${escapeHTML(league.logo)}"
              alt=""
              onerror="this.style.display='none'"
            >
          `

          : `
            <div
              style="
                width:40px;
                height:40px;
                font-size:30px;">
              🏆
            </div>
          `
        }


        <div class="competition-info">

          <div class="competition-name">
            ${
              escapeHTML(
                league.name ||
                "Unknown Competition"
              )
            }
          </div>


          <div class="competition-country">

            ${
              escapeHTML(
                country?.name ||
                ""
              )
            }

          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* ================= SEARCH LEAGUES ================= */

function filterLeagueCatalogue() {

  const search =
    document
      .getElementById(
        "leagueSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allLeagues.filter(
      item => {

        const name =
          item.league?.name
            ?.toLowerCase() ||
          "";


        const country =
          item.country?.name
            ?.toLowerCase() ||
          "";


        return (
          name.includes(search) ||
          country.includes(search)
        );

      }
    );


  displayLeagues(
    filtered
  );

}


/* ================= SEARCH ================= */

function openSearch() {

  const matchesPage =
    document.getElementById(
      "matchesPage"
    );


  if (
    matchesPage.classList
      .contains("active")
  ) {

    document
      .getElementById(
        "leagueSelect"
      )
      .focus();

  } else {

    document
      .getElementById(
        "leagueSearch"
      )
      .focus();

  }

}


/* ================= REFRESH ================= */

function refreshCurrentPage() {

  const matchesPage =
    document.getElementById(
      "matchesPage"
    );


  if (
    matchesPage.classList
      .contains("active")
  ) {

    loadMatches();

  } else {

    loadLeagues();

  }

}


/* ================= START ================= */

createDateBar();

loadMatches();

</script>
