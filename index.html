<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DS GOAL</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #071a3d;
  padding-bottom: 75px;
}

/* ================= HEADER ================= */

header {
  background: #071a3d;
  color: white;
  text-align: center;
  padding: 9px 15px 13px;
  border-bottom: 4px solid #d4af37;
  position: relative;
}

.cl-ball {
  width: 55px;
  height: 55px;
  margin: 0 auto 4px;
  border-radius: 50%;
  background: white;
  border: 2px solid #c9c9c9;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
}

.cl-ball span {
  position: absolute;
  color: #071a3d;
  font-size: 18px;
}

.cl-ball span:nth-child(1) {
  top: 3px;
  left: 19px;
}

.cl-ball span:nth-child(2) {
  top: 17px;
  left: 3px;
}

.cl-ball span:nth-child(3) {
  top: 17px;
  right: 3px;
}

.cl-ball span:nth-child(4) {
  bottom: 3px;
  left: 10px;
}

.cl-ball span:nth-child(5) {
  bottom: 3px;
  right: 10px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo span {
  color: #d4af37;
}

.subtitle {
  font-size: 12px;
  color: #dddddd;
  margin-top: 3px;
}

.header-button {
  position: absolute;
  top: 77px;
  border: none;
  background: transparent;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.search-btn {
  left: 16px;
}

.refresh-btn {
  right: 16px;
}

/* ================= MAIN ================= */

main {
  max-width: 700px;
  margin: auto;
  padding: 14px;
}

/* ================= DATE BAR ================= */

.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 8px 0 14px;
}

.date-arrow {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  background: #eeeeee;
  color: #071a3d;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}

.today {
  font-size: 21px;
  font-weight: bold;
}

/* ================= STATUS TABS ================= */

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
}

.tab {
  flex: 1;
  min-width: 80px;
  border: 1px solid #d4af37;
  background: white;
  color: #071a3d;
  padding: 10px 8px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: #d4af37;
  color: #071a3d;
}

/* ================= LEAGUE DROPDOWN ================= */

.league-filter {
  position: relative;
  margin-bottom: 15px;
}

.league-select {
  width: 100%;
  padding: 13px 40px 13px 14px;
  border: 2px solid #d4af37;
  border-radius: 10px;
  background: white;
  color: #071a3d;
  font-size: 15px;
  font-weight: bold;
  appearance: none;
  outline: none;
}

.league-filter::after {
  content: "▼";
  position: absolute;
  right: 15px;
  top: 13px;
  color: #d4af37;
  pointer-events: none;
}

/* ================= STATUS MESSAGE ================= */

.status {
  text-align: center;
  border: 2px solid #d4af37;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  font-weight: bold;
  font-size: 14px;
}

/* ================= MATCH GROUP ================= */

.league-group {
  border: 1px solid #dddddd;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 15px;
  background: white;
}

.league-header {
  background: #071a3d;
  color: white;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.league-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  font-size: 14px;
}

.league-logo {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: white;
  object-fit: contain;
}

.league-count {
  background: #d4af37;
  color: #071a3d;
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}

/* ================= MATCH ================= */

.match {
  padding: 12px 10px;
  border-bottom: 1px solid #eeeeee;
}

.match:last-child {
  border-bottom: none;
}

.match-status {
  text-align: center;
  font-size: 11px;
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 7px;
}

.team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 7px 0;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 78%;
}

.team img {
  width: 27px;
  height: 27px;
  object-fit: contain;
}

.team-name {
  font-size: 14px;
}

.score {
  font-size: 16px;
  font-weight: bold;
}

/* ================= EMPTY ================= */

.empty-state {
  text-align: center;
  padding: 35px 15px;
}

.empty-ball {
  width: 125px;
  height: 125px;
  margin: 0 auto 20px;
  border-radius: 50%;
  border: 4px solid #d4af37;
  background: white;
  position: relative;
}

.empty-ball span {
  position: absolute;
  color: #071a3d;
  font-size: 35px;
}

.empty-ball .s1 {
  top: 8px;
  left: 43px;
}

.empty-ball .s2 {
  top: 43px;
  left: 7px;
}

.empty-ball .s3 {
  top: 43px;
  right: 7px;
}

.empty-ball .s4 {
  bottom: 8px;
  left: 25px;
}

.empty-ball .s5 {
  bottom: 8px;
  right: 25px;
}

.empty-text {
  color: #777777;
  font-size: 14px;
}

/* ================= LEAGUES PAGE ================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin: 10px 0 16px;
}

.league-search {
  width: 100%;
  padding: 12px;
  border: 1px solid #cccccc;
  border-radius: 9px;
  margin-bottom: 12px;
  font-size: 15px;
  outline: none;
}

.competition-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  margin-bottom: 8px;
  background: white;
}

.competition-card img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.competition-info {
  flex: 1;
}

.competition-name {
  font-weight: bold;
  color: #071a3d;
}

.competition-country {
  font-size: 12px;
  color: #777777;
  margin-top: 3px;
}

.arrow {
  color: #d4af37;
  font-size: 23px;
}

/* ================= NEWS ================= */

.news-empty {
  text-align: center;
  color: #777777;
  padding: 60px 20px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #071a3d;
  border-top: 3px solid #d4af37;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-button {
  border: none;
  background: none;
  color: white;
  font-size: 12px;
  text-align: center;
  cursor: pointer;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-button.active {
  color: #d4af37;
}

/* ================= LOADING ================= */

.loading {
  text-align: center;
  padding: 30px;
  color: #777777;
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .tabs {
    gap: 6px;
  }

  .tab {
    font-size: 13px;
    padding: 9px 6px;
  }

  .logo {
    font-size: 25px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="cl-ball">
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
    <span>★</span>
  </div>

  <div class="logo">
    DS <span>GOAL</span>
  </div>

  <div class="subtitle">
    Live Football Scores
  </div>

  <button class="header-button search-btn" onclick="openSearch()">
    ⌕
  </button>

  <button class="header-button refresh-btn" onclick="refreshCurrentPage()">
    ↻
  </button>

</header>


<main>

<!-- ================= MATCHES PAGE ================= -->

<section id="matchesPage" class="page active">

  <div class="date-bar">

    <button class="date-arrow" onclick="previousDay()">
      ‹
    </button>

    <div class="today">
      Today
    </div>

    <button class="date-arrow" onclick="nextDay()">
      ›
    </button>

  </div>


  <!-- STATUS FILTER -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="changeTab('all', this)">
      All
    </button>

    <button
      class="tab"
      onclick="changeTab('live', this)">
      Live
    </button>

    <button
      class="tab"
      onclick="changeTab('upcoming', this)">
      Upcoming
    </button>

    <button
      class="tab"
      onclick="changeTab('finished', this)">
      Finished
    </button>

  </div>


  <!-- LEAGUE FILTER -->

  <div class="league-filter">

    <select
      id="leagueSelect"
      class="league-select"
      onchange="filterMatchesByLeague()">

      <option value="all">
        All Leagues
      </option>

    </select>

  </div>


  <div id="matchStatus" class="status">
    Loading matches...
  </div>


  <div id="matchesContainer"></div>

</section>


<!-- ================= LEAGUES PAGE ================= -->

<section id="leaguesPage" class="page">

  <div class="page-title">
    All Competitions
  </div>

  <input
    id="leagueSearch"
    class="league-search"
    type="text"
    placeholder="Search leagues or countries..."
    oninput="filterLeagueCatalogue()"
  >

  <div id="leaguesContainer">

    <div class="loading">
      Loading competitions...
    </div>

  </div>

</section>


<!-- ================= NEWS PAGE ================= -->

<section id="newsPage" class="page">

  <div class="page-title">
    Football News
  </div>

  <div class="news-empty">
    News section coming soon.
  </div>

</section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    onclick="showPage('matchesPage', this)">

    <span class="nav-icon">⚽</span>
    Matches

  </button>


  <button
    class="nav-button"
    onclick="showPage('leaguesPage', this)">

    <span class="nav-icon">🏆</span>
    Leagues

  </button>


  <button
    class="nav-button"
    onclick="showPage('newsPage', this)">

    <span class="nav-icon">📰</span>
    News

  </button>

</nav>


<script>

/* ================= BACKEND ================= */

const BACKEND =
"https://football-livescore-backend.vercel.app";


/* ================= VARIABLES ================= */

let currentTab = "all";

let selectedLeague = "all";

let allMatches = [];

let allLeagues = [];


/* ================= PAGE NAVIGATION ================= */

function showPage(pageId, button) {

  document
    .querySelectorAll(".page")
    .forEach(page => {
      page.classList.remove("active");
    });

  document
    .getElementById(pageId)
    .classList.add("active");


  document
    .querySelectorAll(".nav-button")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  if (
    pageId === "leaguesPage" &&
    allLeagues.length === 0
  ) {

    loadLeagues();

  }

}


/* ================= TAB ================= */

function changeTab(tab, button) {

  currentTab = tab;

  selectedLeague = "all";

  document
    .getElementById("leagueSelect")
    .value = "all";


  document
    .querySelectorAll(".tab")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  loadMatches();

}


/* ================= LOAD MATCHES ================= */

async function loadMatches() {

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matchesContainer");


  status.textContent =
    "Loading matches...";

  container.innerHTML = "";


  try {

    let matches = [];


    /* ALL */

    if (currentTab === "all") {

      const results =
        await Promise.allSettled([

          fetch(BACKEND + "/api/football")
            .then(r => r.json()),

          fetch(BACKEND + "/api/upcoming")
            .then(r => r.json())

        ]);


      results.forEach(result => {

        if (
          result.status === "fulfilled" &&
          result.value.response
        ) {

          matches =
            matches.concat(
              result.value.response
            );

        }

      });

    }


    /* LIVE */

    if (currentTab === "live") {

      const response =
        await fetch(
          BACKEND + "/api/football"
        );

      const data =
        await response.json();

      matches =
        data.response || [];

    }


    /* UPCOMING */

    if (currentTab === "upcoming") {

      const response =
        await fetch(
          BACKEND + "/api/upcoming"
        );

      const data =
        await response.json();

      matches =
        data.response || [];

    }


    /* FINISHED */

    if (currentTab === "finished") {

      const response =
        await fetch(
          BACKEND + "/api/finished"
        );

      const data =
        await response.json();

      matches =
        data.response || [];

    }


    /* REMOVE DUPLICATES */

    const unique =
      new Map();

    matches.forEach(match => {

      if (match.fixture?.id) {

        unique.set(
          match.fixture.id,
          match
        );

      }

    });


    allMatches =
      Array.from(unique.values());


    updateLeagueDropdown(
      allMatches
    );


    displayMatches(
      allMatches
    );


  } catch (error) {

    status.textContent =
      "Unable to load matches.";

    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-ball">
          <span class="s1">★</span>
          <span class="s2">★</span>
          <span class="s3">★</span>
          <span class="s4">★</span>
          <span class="s5">★</span>
        </div>

        <div class="empty-text">
          No matches available right now.
        </div>
      </div>
    `;

  }

}


/* ================= LEAGUE DROPDOWN ================= */

function updateLeagueDropdown(matches) {

  const select =
    document.getElementById(
      "leagueSelect"
    );


  const leagues = {};


  matches.forEach(match => {

    const id =
      match.league?.id;

    const name =
      match.league?.name;


    if (id && name) {

      leagues[id] = {
        name: name,
        logo:
          match.league?.logo || ""
      };

    }

  });


  select.innerHTML = `
    <option value="all">
      All Leagues
    </option>
  `;


  Object.keys(leagues)
    .sort((a, b) =>
      leagues[a].name.localeCompare(
        leagues[b].name
      )
    )
    .forEach(id => {

      const option =
        document.createElement("option");

      option.value = id;

      option.textContent =
        leagues[id].name;

      select.appendChild(option);

    });

}


/* ================= FILTER MATCHES ================= */

function filterMatchesByLeague() {

  selectedLeague =
    document.getElementById(
      "leagueSelect"
    ).value;


  displayMatches(allMatches);

}


/* ================= DISPLAY MATCHES ================= */

function displayMatches(matches) {

  const status =
    document.getElementById(
      "matchStatus"
    );

  const container =
    document.getElementById(
      "matchesContainer"
    );


  let filtered =
    matches;


  if (selectedLeague !== "all") {

    filtered =
      matches.filter(match =>
        String(match.league?.id) ===
        String(selectedLeague)
      );

  }


  container.innerHTML = "";


  if (filtered.length === 0) {

    status.textContent =
      currentTab === "all"
      ? "No matches available."
      : "No " + currentTab + " matches.";

    container.innerHTML = `
      <div class="empty-state">

        <div class="empty-ball">
          <span class="s1">★</span>
          <span class="s2">★</span>
          <span class="s3">★</span>
          <span class="s4">★</span>
          <span class="s5">★</span>
        </div>

        <div class="empty-text">
          No matches found.
        </div>

      </div>
    `;

    return;

  }


  status.textContent =
    filtered.length +
    " matches";


  /* GROUP BY LEAGUE */

  const groups = {};


  filtered.forEach(match => {

    const id =
      match.league?.id ||
      "other";

    const name =
      match.league?.name ||
      "Other Competitions";


    if (!groups[id]) {

      groups[id] = {

        name: name,

        logo:
          match.league?.logo || "",

        matches: []

      };

    }


    groups[id].matches.push(
      match
    );

  });


  /* DISPLAY EACH LEAGUE */

  Object.values(groups)
    .forEach(group => {

      const leagueBox =
        document.createElement(
          "div"
        );

      leagueBox.className =
        "league-group";


      leagueBox.innerHTML = `

        <div class="league-header">

          <div class="league-title">

            ${
              group.logo

              ? `
                <img
                  class="league-logo"
                  src="${group.logo}"
                >
              `

              : ""
            }

            ${group.name}

          </div>

          <div class="league-count">
            ${group.matches.length}
          </div>

        </div>

      `;


      group.matches.forEach(
        match => {

          const home =
            match.teams?.home?.name ||
            "Home";

          const away =
            match.teams?.away?.name ||
            "Away";


          const homeLogo =
            match.teams?.home?.logo ||
            "";

          const awayLogo =
            match.teams?.away?.logo ||
            "";


          const homeScore =
            match.goals?.home ?? "-";

          const awayScore =
            match.goals?.away ?? "-";


          let matchTime = "";


          if (
            match.fixture?.date
          ) {

            matchTime =
              new Date(
                match.fixture.date
              ).toLocaleTimeString(
                [],
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              );

          }


          const matchBox =
            document.createElement(
              "div"
            );

          matchBox.className =
            "match";


          matchBox.innerHTML = `

            <div class="match-status">
              ${matchTime}
            </div>


            <div class="team-row">

              <div class="team">

                ${
                  homeLogo

                  ? `
                    <img
                      src="${homeLogo}"
                    >
                  `

                  : ""
                }

                <span class="team-name">
                  ${home}
                </span>

              </div>


              <div class="score">
                ${homeScore}
              </div>

            </div>


            <div class="team-row">

              <div class="team">

                ${
                  awayLogo

                  ? `
                    <img
                      src="${awayLogo}"
                    >
                  `

                  : ""
                }

                <span class="team-name">
                  ${away}
                </span>

              </div>


              <div class="score">
                ${awayScore}
              </div>

            </div>

          `;


          leagueBox.appendChild(
            matchBox
          );

        });


      container.appendChild(
        leagueBox
      );

    });

}


/* ================= LEAGUES CATALOGUE ================= */

async function loadLeagues() {

  const container =
    document.getElementById(
      "leaguesContainer"
    );


  container.innerHTML =
    `<div class="loading">
       Loading competitions...
     </div>`;


  try {

    const response =
      await fetch(
        BACKEND + "/api/leagues"
      );


    const data =
      await response.json();


    if (!data.response) {

      container.innerHTML =
        `<div class="loading">
          Unable to load competitions.
        </div>`;

      return;

    }


    allLeagues =
      data.response;


    displayLeagues(
      allLeagues
    );


  } catch (error) {

    container.innerHTML =
      `<div class="loading">
        Unable to load competitions.
      </div>`;

  }

}


/* ================= DISPLAY LEAGUES ================= */

function displayLeagues(
  leagues
) {

  const container =
    document.getElementById(
      "leaguesContainer"
    );


  container.innerHTML = "";


  leagues.forEach(item => {

    const league =
      item.league;

    const country =
      item.country;


    if (!league) return;


    const card =
      document.createElement(
        "div"
      );

    card.className =
      "competition-card";


    card.innerHTML = `

      ${
        league.logo

        ? `
          <img
            src="${league.logo}"
          >
        `

        : `
          <div
            style="
            width:40px;
            height:40px;
            font-size:30px;">
            🏆
          </div>
        `
      }


      <div class="competition-info">

        <div class="competition-name">
          ${
            league.name ||
            "Unknown Competition"
          }
        </div>

        <div class="competition-country">
          ${
            country?.name || ""
          }
        </div>

      </div>


      <div class="arrow">
        ›
      </div>

    `;


    container.appendChild(
      card
    );

  });

}


/* ================= SEARCH LEAGUES ================= */

function filterLeagueCatalogue() {

  const search =
    document
      .getElementById(
        "leagueSearch"
      )
      .value
      .toLowerCase();


  const filtered =
    allLeagues.filter(item => {

      const name =
        item.league?.name
          ?.toLowerCase() || "";


      const country =
        item.country?.name
          ?.toLowerCase() || "";


      return (
        name.includes(search) ||
        country.includes(search)
      );

    });


  displayLeagues(
    filtered
  );

}


/* ================= SEARCH ================= */

function openSearch() {

  if (
    document
      .getElementById(
        "matchesPage"
      )
      .classList
      .contains("active")
  ) {

    const leagueSelect =
      document.getElementById(
        "leagueSelect"
      );

    leagueSelect.focus();

  } else {

    document
      .getElementById(
        "leagueSearch"
      )
      .focus();

  }

}


/* ================= REFRESH ================= */

function refreshCurrentPage() {

  const matchesPage =
    document.getElementById(
      "matchesPage"
    );


  if (
    matchesPage.classList
      .contains("active")
  ) {

    loadMatches();

  } else {

    loadLeagues();

  }

}
