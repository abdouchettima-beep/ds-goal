<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DS Goal</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #172033;
  padding-bottom: 75px;
}

/* HEADER */
.header {
  background: #071b3a;
  color: white;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.brand {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand .goal {
  color: #d4a72c;
}

/* SEARCH + REFRESH */
.header-buttons {
  position: absolute;
  right: 15px;
  display: flex;
  gap: 8px;
}

.header-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.header-btn:active {
  transform: scale(0.92);
}

/* SEARCH BOX */
.search-container {
  display: none;
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.search-container input {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #d5d8df;
  border-radius: 8px;
  outline: none;
  font-size: 15px;
}

.search-container input:focus {
  border-color: #d4a72c;
}

/* DATE */
.date-title {
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  padding: 18px 0 10px;
  color: #555;
}

/* TABS */
.tabs {
  display: flex;
  margin: 0 12px 15px;
  background: white;
  border-radius: 10px;
  padding: 4px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.tab {
  flex: 1;
  text-align: center;
  padding: 11px 5px;
  font-size: 14px;
  font-weight: bold;
  color: #697386;
  cursor: pointer;
  border-radius: 8px;
}

.tab.active {
  background: #071b3a;
  color: white;
}

/* CONTENT */
#matches {
  padding: 0 10px;
}

/* LEAGUE */
.league {
  background: white;
  margin-bottom: 14px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.league-header {
  background: #071b3a;
  color: white;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  font-weight: bold;
}

.league-header img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
  padding: 2px;
}

/* MATCH */
.match {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 10px;
  border-bottom: 1px solid #eeeeee;
  min-height: 65px;
}

.match:last-child {
  border-bottom: none;
}

.team {
  width: 35%;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
  text-align: left;
}

.team img {
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.score {
  width: 22%;
  text-align: center;
  font-weight: bold;
  font-size: 15px;
}

.live {
  color: #e53935;
  font-size: 11px;
  display: block;
  margin-top: 3px;
}

.time {
  color: #777;
  font-size: 12px;
  font-weight: normal;
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: #707784;
}

.empty h3 {
  margin-top: 8px;
  color: #4b5563;
}

.empty p {
  margin-top: 6px;
  font-size: 13px;
}

/* STAR PATTERN FOOTBALL */
.star-ball {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #eeeeee 70%, #d4d4d4);
  border: 3px solid #cfcfcf;
  position: relative;
  margin: 5px auto 18px;
  box-shadow:
    0 5px 15px rgba(0,0,0,0.18),
    inset -8px -8px 15px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* Main central star */
.star {
  position: absolute;
  width: 43px;
  height: 43px;
  background: #111827;
  left: 29px;
  top: 29px;
  clip-path: polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 94%,
    50% 71%,
    21% 94%,
    32% 57%,
    2% 35%,
    39% 35%
  );
  transform: rotate(8deg);
}

/* Connecting panel shapes */
.star-line {
  position: absolute;
  background: #111827;
  height: 7px;
  width: 42px;
  border-radius: 5px;
}

.line1 {
  top: 19px;
  left: 29px;
  transform: rotate(-38deg);
}

.line2 {
  top: 20px;
  right: 27px;
  transform: rotate(38deg);
}

.line3 {
  bottom: 20px;
  left: 28px;
  transform: rotate(38deg);
}

.line4 {
  bottom: 19px;
  right: 27px;
  transform: rotate(-38deg);
}

/* Smaller stars */
.small-star {
  position: absolute;
  width: 22px;
  height: 22px;
  background: #111827;
  clip-path: polygon(
    50% 0%,
    62% 35%,
    100% 35%,
    69% 57%,
    80% 100%,
    50% 73%,
    20% 100%,
    31% 57%,
    0% 35%,
    38% 35%
  );
}

.s1 {
  left: 5px;
  top: 27px;
  transform: rotate(-15deg);
}

.s2 {
  right: 5px;
  top: 27px;
  transform: rotate(15deg);
}

.s3 {
  left: 18px;
  bottom: 7px;
  transform: rotate(20deg);
}

.s4 {
  right: 18px;
  bottom: 7px;
  transform: rotate(-20deg);
}

.s5 {
  left: 40px;
  top: 5px;
  transform: rotate(5deg);
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}

.nav-item {
  text-align: center;
  color: #7b8494;
  font-size: 11px;
  cursor: pointer;
}

.nav-item span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #071b3a;
  font-weight: bold;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 35px;
  color: #777;
  font-size: 14px;
}

/* MOBILE */
@media (max-width: 400px) {

  .brand {
    font-size: 24px;
  }

  .team {
    font-size: 12px;
  }

  .team img {
    width: 22px;
    height: 22px;
  }

  .score {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="brand">
    DS <span class="goal">GOAL</span>
  </div>

  <div class="header-buttons">
    <button class="header-btn" onclick="toggleSearch()">⌕</button>
    <button class="header-btn" onclick="loadMatches()">↻</button>
  </div>

</header>

<!-- SEARCH -->
<div class="search-container" id="searchBox">
  <input
    type="text"
    id="searchInput"
    placeholder="Search team or league..."
    oninput="filterMatches()"
  >
</div>

<!-- DATE -->
<div class="date-title">
  Today
</div>

<!-- TABS -->
<div class="tabs">

  <div class="tab active" id="liveTab" onclick="changeTab('live')">
    Live
  </div>

  <div class="tab" id="upcomingTab" onclick="changeTab('upcoming')">
    Upcoming
  </div>

  <div class="tab" id="finishedTab" onclick="changeTab('finished')">
    Finished
  </div>

</div>

<!-- MATCHES -->
<div id="matches">

  <div class="loading">
    Loading matches...
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <div class="nav-item active">
    <span>⚽</span>
    Matches
  </div>

  <div class="nav-item">
    <span>🏆</span>
    Leagues
  </div>

  <div class="nav-item">
    <span>📰</span>
    News
  </div>

</div>


<script>

/* =========================
   DS GOAL BACKEND
========================= */

const LIVE_API =
  "https://football-livescore-backend.vercel.app/api/football";

const UPCOMING_API =
  "https://football-livescore-backend.vercel.app/api/upcoming";


let currentTab = "live";
let allMatches = [];


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches() {

  const container = document.getElementById("matches");

  container.innerHTML =
    '<div class="loading">Loading matches...</div>';

  try {

    let url =
      currentTab === "upcoming"
        ? UPCOMING_API
        : LIVE_API;

    const response = await fetch(url);

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.error || "API error");
    }

    if (!data.response || !Array.isArray(data.response)) {
      showEmpty();
      return;
    }

    allMatches = data.response;

    if (allMatches.length === 0) {
      showEmpty();
      return;
    }

    displayMatches(allMatches);

  } catch (error) {

    console.log(error);

    container.innerHTML = `
      <div class="empty">

        <div class="star-ball">

          <div class="star"></div>

          <div class="star-line line1"></div>
          <div class="star-line line2"></div>
          <div class="star-line line3"></div>
          <div class="star-line line4"></div>

          <div class="small-star s1"></div>
          <div class="small-star s2"></div>
          <div class="small-star s3"></div>
          <div class="small-star s4"></div>
          <div class="small-star s5"></div>

        </div>

        <h3>Unable to load matches</h3>

        <p>
          Please check your connection or try again later.
        </p>

      </div>
    `;

  }

}


/* =========================
   DISPLAY MATCHES
========================= */

function displayMatches(matches) {

  const container = document.getElementById("matches");

  container.innerHTML = "";

  if (!matches.length) {
    showEmpty();
    return;
  }

  /* GROUP BY LEAGUE */

  const leagues = {};

  matches.forEach(match => {

    const leagueName =
      match.league?.name || "Other Matches";

    const leagueId =
      match.league?.id || "";

    const key = leagueId + "_" + leagueName;

    if (!leagues[key]) {

      leagues[key] = {
        name: leagueName,
        logo: match.league?.logo || "",
        matches: []
      };

    }

    leagues[key].matches.push(match);

  });


  /* CREATE LEAGUES */

  Object.values(leagues).forEach(league => {

    const leagueBox =
      document.createElement("div");

    leagueBox.className = "league";


    /* LEAGUE HEADER */

    const header =
      document.createElement("div");

    header.className = "league-header";


    if (league.logo) {

      const logo =
        document.createElement("img");

      logo.src = league.logo;
      logo.alt = "";

      header.appendChild(logo);

    }


    const title =
      document.createElement("span");

    title.textContent = league.name;

    header.appendChild(title);

    leagueBox.appendChild(header);


    /* MATCHES */

    league.matches.forEach(match => {

      const matchElement =
        createMatch(match);

      leagueBox.appendChild(matchElement);

    });


    container.appendChild(leagueBox);

  });

}


/* =========================
   CREATE MATCH
========================= */

function createMatch(match) {

  const fixture =
    match.fixture || {};

  const teams =
    match.teams || {};

  const goals =
    match.goals || {};

  const status =
    fixture.status || {};


  const home =
    teams.home || {};

  const away =
    teams.away || {};


  const div =
    document.createElement("div");

  div.className = "match";


  /* HOME TEAM */

  const homeDiv =
    document.createElement("div");

  homeDiv.className =
    "team home";


  const homeName =
    document.createElement("span");

  homeName.textContent =
    home.name || "Home";


  const homeLogo =
    document.createElement("img");

  if (home.logo) {
    homeLogo.src = home.logo;
  }

  homeLogo.alt = "";


  homeDiv.appendChild(homeName);
  homeDiv.appendChild(homeLogo);


  /* SCORE */

  const scoreDiv =
    document.createElement("div");

  scoreDiv.className = "score";


  let scoreText = "-";

  if (
    goals.home !== null &&
    goals.home !== undefined &&
    goals.away !== null &&
    goals.away !== undefined
  ) {

    scoreText =
      goals.home + " - " + goals.away;

  }


  const score =
    document.createElement("div");

  score.textContent = scoreText;

  scoreDiv.appendChild(score);


  /* STATUS */

  const statusText =
    status.short || "";


  if (currentTab === "live") {

    const live =
      document.createElement("span");

    live.className = "live";

    if (status.elapsed) {

      live.textContent =
        status.elapsed + "' LIVE";

    } else {

      live.textContent =
        "LIVE";

    }

    scoreDiv.appendChild(live);

  } else {

    const time =
      document.createElement("span");

    time.className = "time";


    if (fixture.date) {

      const date =
        new Date(fixture.date);

      time.textContent =
        date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

    }

    scoreDiv.appendChild(time);

  }


  /* AWAY TEAM */

  const awayDiv =
    document.createElement("div");

  awayDiv.className =
    "team away";


  const awayLogo =
    document.createElement("img");

  if (away.logo) {
    awayLogo.src = away.logo;
  }

  awayLogo.alt = "";


  const awayName =
    document.createElement("span");

  awayName.textContent =
    away.name || "Away";


  awayDiv.appendChild(awayLogo);
  awayDiv.appendChild(awayName);


  /* ADD EVERYTHING */

  div.appendChild(homeDiv);
  div.appendChild(scoreDiv);
  div.appendChild(awayDiv);


  return div;

}


/* =========================
   EMPTY STATE
========================= */

function showEmpty() {

  const container =
    document.getElementById("matches");


  let title =
    "No live matches right now.";

  let message =
    "Check again later for live football.";

  if (currentTab === "upcoming") {

    title =
      "No upcoming matches found.";

    message =
      "Upcoming matches will appear here.";

  }

  if (currentTab === "finished") {

    title =
      "No finished matches.";

    message =
      "Finished matches will appear here.";

  }


  container.innerHTML = `

    <div class="empty">

      <div class="star-ball">

        <div class="star"></div>

        <div class="star-line line1"></div>
        <div class="star-line line2"></div>
        <div class="star-line line3"></div>
        <div class="star-line line4"></div>

        <div class="small-star s1"></div>
        <div class="small-star s2"></div>
        <div class="small-star s3"></div>
        <div class="small-star s4"></div>
        <div class="small-star s5"></div>

      </div>

      <h3>${title}</h3>

      <p>${message}</p>

    </div>

  `;

}


/* =========================
   CHANGE TAB
========================= */

function changeTab(tab) {

  currentTab = tab;


  document
    .getElementById("liveTab")
    .classList.remove("active");

  document
    .getElementById("upcomingTab")
    .classList.remove("active");

  document
    .getElementById("finishedTab")
    .classList.remove("active");


  if (tab === "live") {

    document
      .getElementById("liveTab")
      .classList.add("active");

    loadMatches();

  }


  if (tab === "upcoming") {

    document
      .getElementById("upcomingTab")
      .classList.add("active");

    loadMatches();

  }


  if (tab === "finished") {

    document
      .getElementById("finishedTab")
      .classList.add("active");

    showEmpty();

  }

}


/* =========================
   SEARCH
========================= */

function toggleSearch() {

  const box =
    document.getElementById("searchBox");

  if (box.style.display === "block") {

    box.style.display = "none";

  } else {

    box.style.display = "block";

    document
      .getElementById("searchInput")
      .focus();

  }

}


/* =========================
   FILTER
========================= */

function filterMatches() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    displayMatches(allMatches);

    return;

  }


  const filtered =
    allMatches.filter(match => {

      const home =
        match.teams?.home?.name
        ?.toLowerCase() || "";

      const away =
        match.teams?.away?.name
        ?.toLowerCase() || "";

      const league =
        match.league?.name
        ?.toLowerCase() || "";


      return (
        home.includes(search) ||
        away.includes(search) ||
        league.includes(search)
      );

    });


  displayMatches(filtered);

}


/* =========================
   START APP
========================= */

loadMatches();


/* =========================
   AUTO REFRESH
========================= */

setInterval(() => {

  if (currentTab === "live") {
    loadMatches();
  }

}, 60000);

</script>

</body>
</html>
