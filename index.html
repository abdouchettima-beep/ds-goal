<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAWA GOAL - Live Football Scores</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  color: #111827;
  padding-bottom: 75px;
}

/* HEADER */
.header {
  background: #061b35;
  color: white;
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.menu,
.icon-btn {
  font-size: 24px;
  cursor: pointer;
}

.logo {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:25px;
  font-weight:900;
  letter-spacing:-.8px;
  white-space:nowrap;
}
.logo-mark {
  width:34px;
  height:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:2px solid #F5C242;
  border-radius:11px 11px 11px 4px;
  color:#F5C242;
  font-size:13px;
  letter-spacing:-1px;
  font-weight:900;
  box-shadow:inset 0 0 0 2px rgba(245,194,66,.12);
}
.logo-sawa { color:#FFFFFF; }
.logo-goal { color:#F5C242; }
.logo-ball { color:#F5C242; font-size:18px; margin-left:-3px; }

.page-title {
  background: #082544;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 12px;
}

/* DATE BAR */
.date-bar {
  background: #061b35;
  color: white;
  display: flex;
  overflow-x: auto;
  gap: 5px;
  padding: 10px 8px;
  scrollbar-width: none;
}

.date-bar::-webkit-scrollbar {
  display: none;
}

.date-item {
  min-width: 78px;
  text-align: center;
  padding: 9px 5px;
  border-radius: 8px;
  cursor: pointer;
  flex-shrink: 0;
}

.date-item .day {
  font-weight: bold;
  font-size: 13px;
}

.date-item .date {
  font-size: 12px;
  margin-top: 5px;
  opacity: .8;
}

.date-item.active {
  background: #36d46f;
  color: #062038;
}

.date-item.active .date {
  opacity: 1;
}

/* FILTERS */
.filters {
  background: #eef2f5;
  padding: 12px 10px 8px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
}

.filter-btn {
  border: 1px solid #cad3dd;
  background: white;
  border-radius: 20px;
  padding: 9px 15px;
  white-space: nowrap;
  font-size: 13px;
  cursor: pointer;
}

.filter-btn.active {
  background: #36c96a;
  color: white;
  border-color: #36c96a;
  font-weight: bold;
}

/* LEAGUE SELECT */
.league-select-wrap {
  padding: 4px 10px 12px;
  background: #eef2f5;
}

#leagueSelect {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  background: white;
  font-size: 14px;
}

/* CONTENT */
.content {
  padding: 0 10px 20px;
}

.status-message {
  text-align: center;
  padding: 35px 15px;
  color: #667085;
  font-size: 14px;
}

.error-message {
  color: #b42318;
  background: #fee4e2;
  border-radius: 8px;
  padding: 15px;
  margin-top: 10px;
}

/* LEAGUE */
.league-block {
  background: white;
  margin-bottom: 12px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.league-header {
  background: #082c52;
  color: white;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: bold;
}

.league-logo {
  width: 25px;
  height: 25px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
  padding: 2px;
}

.league-name {
  flex: 1;
  font-size: 14px;
}

.league-country {
  font-size: 10px;
  opacity: .75;
}

/* MATCH */
.match {
  min-height: 70px;
  border-bottom: 1px solid #e7ebef;
  display: grid;
  grid-template-columns: 55px 1fr 65px 1fr 20px;
  align-items: center;
  gap: 3px;
  padding: 7px 5px;
}

.match:last-child {
  border-bottom: none;
}

.match-time {
  text-align: center;
  font-size: 11px;
  color: #667085;
}

.live-label {
  color: #e00000;
  font-weight: bold;
  font-size: 11px;
}

.team {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  min-width: 0;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
}

.team-logo {
  width: 25px;
  height: 25px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-name {
  font-weight: 800;
  font-size: clamp(12px, 3.5vw, 15px);
  line-height: 1.2;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
}

.live-score {
  color: #d90000;
}

.vs {
  color: #667085;
  font-size: 12px;
}

.arrow {
  color: #8b95a1;
  font-size: 18px;
}

/* SEARCH */
.search-box {
  display: none;
  background: #061b35;
  padding: 8px 10px 12px;
}

.search-box.show {
  display: block;
}

.search-box input {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #061b35;
  color: white;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 200;
  box-shadow: 0 -2px 8px rgba(0,0,0,.15);
}

.nav-item {
  text-align: center;
  font-size: 11px;
  opacity: .8;
  cursor: pointer;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #36d46f;
  opacity: 1;
}

/* LEAGUES PAGE */
.page {
  display: none;
}

.page.active {
  display: block;
}

.league-list-item {
  background: white;
  margin-bottom: 7px;
  padding: 13px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.league-list-item img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

/* IN-APP MATCH EVENT ALERTS */
.team { position: relative; }
.goal-alert {
  position: absolute;
  top: calc(50% + 11px);
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 15px;
  white-space: nowrap;
}
.goal-alert.confirmed {
  padding: 2px 5px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 4px;
  background: #e11d48;
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  line-height: 1.25;
  box-shadow: 0 1px 3px rgba(15,23,42,.18);
  animation: goalPulse 1s ease-in-out infinite;
}
.goal-alert.pending {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(225,29,72,.16);
  animation: soundWave .72s ease-out infinite;
}
.goal-dot {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e11d48;
  box-shadow: 0 0 0 2px rgba(225,29,72,.22);
  animation: redDotBlink .42s ease-in-out infinite;
}
.team.home .goal-alert { right: 0; }
.team.away .goal-alert { left: 0; }
.team.goal-scored .team-name {
  color: #b91c1c;
  font-weight: 900;
}
.team.goal-scored {
  animation: goalGlow 1s ease-in-out 3;
}
.match.has-event-alert {
  position: relative;
  min-height: 64px;
  padding-bottom: 8px;
}
.match-event-alert {
  position: absolute;
  left: 5px;
  right: 5px;
  bottom: 3px;
  display: block;
  text-align: center;
  padding: 4px 6px;
  border-radius: 5px;
  color: #fff;
  background: #be123c;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .3px;
  line-height: 1.2;
  animation: goalPulse 1s ease-in-out infinite;
}
.match-event-alert.var { background: #7c3aed; }
.match-event-alert.penalty { background: #b45309; }
.match-event-alert.red-card { background: #b91c1c; }
@keyframes goalPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .55; }
}
@keyframes redDotBlink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .25; transform: scale(.72); }
}
@keyframes soundWave {
  0% { box-shadow: 0 0 0 0 rgba(225,29,72,.45); }
  100% { box-shadow: 0 0 0 11px rgba(225,29,72,0); }
}
@media (prefers-reduced-motion: reduce) {
  .goal-alert.pending, .goal-dot, .goal-alert.confirmed { animation: none; }
}
@keyframes goalGlow {
  0%, 100% { background: transparent; }
  50% { background: #fee2e2; }
}
@keyframes eventRowFlash {
  0%, 100% { background: #fff1f2; }
  50% { background: #fecdd3; }
}


.detail-tabs { display:flex; gap:0; overflow-x:auto; position:sticky; top:0; z-index:4; margin:12px 0 4px; background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none; }
.detail-tabs::-webkit-scrollbar { display:none; }
.detail-tab { flex:0 0 auto; border:0; border-bottom:3px solid transparent; padding:13px 15px 11px; background:transparent; color:#667085; font-size:13px; font-weight:750; cursor:pointer; }
.detail-tab.active { color:#061b35; border-bottom-color:#f5c242; }
.detail-tab-section[hidden] { display:none !important; }
.detail-card h3 { font-size:14px; letter-spacing:.1px; }
.detail-score-card { border-radius:4px; box-shadow:none; border:1px solid var(--line); }
.detail-card { border-radius:4px; box-shadow:none; border:1px solid var(--line); }

/* LIGHT DEFAULT + DARK MODE */
:root { color-scheme: light; --app-bg:#eef2f5; --surface:#ffffff; --text:#111827; --muted:#667085; --line:#e7ebef; --soft:#f7f9fb; --navy:#061b35; --navy2:#082c52; --gold:#f5c242; }
body { background:var(--app-bg); color:var(--text); }
.filters,.league-select-wrap { background:var(--app-bg); }
.league-block,.league-list-item,.filter-btn,#leagueSelect,.detail-card,.detail-score-card { background:var(--surface); color:var(--text); }
.match { border-color:var(--line); cursor:pointer; }
.match:active { background:rgba(245,194,66,.13); }
.filter-btn { color:var(--text); }
.filter-btn.active,.date-item.active,.nav-item.active { background:var(--gold); color:#061b35; border-color:var(--gold); }
.date-item.active { background:var(--gold); }
.header,.date-bar,.bottom-nav,.search-box { background:var(--navy); }
.logo span { color:var(--gold); }
.logo .logo-sawa { color:#FFFFFF; }
.logo .logo-goal { color:var(--gold); }
body.dark-mode { color-scheme:dark; --app-bg:#000000; --surface:#111111; --text:#f5f5f5; --muted:#a3a3a3; --line:#292929; --soft:#080808; }
/* True black dark mode */
body.dark-mode, body.dark-mode .page, body.dark-mode .content,
body.dark-mode .filters, body.dark-mode .league-select-wrap,
body.dark-mode .date-bar { background:#000000; }
body.dark-mode .header, body.dark-mode .bottom-nav, body.dark-mode .search-box { background:#050505; }

body.dark-mode .match, body.dark-mode .detail-card, body.dark-mode .detail-score-card,
body.dark-mode .league-block, body.dark-mode .league-list-item,
body.dark-mode .filter-btn, body.dark-mode #leagueSelect { background:#111111; color:#f5f5f5; border-color:#292929; }
body.dark-mode .match:active { background:#202020; }
body.dark-mode .filter-btn.active, body.dark-mode .date-item.active, body.dark-mode .nav-item.active { background:#f5c242; color:#000000; }
body.dark-mode .detail-tabs { background:#050505; border-color:#292929; }
body.dark-mode .detail-tab { color:#b8b8b8; }
body.dark-mode .detail-tab.active { color:#f5c242; border-bottom-color:#f5c242; }
body.dark-mode .detail-score-card { box-shadow:0 1px 5px #ffffff08; }
body.dark-mode .standings-table th { background:#181818; color:#f5f5f5; }
body.dark-mode .standings-table td { border-color:#292929; }
body.dark-mode .standings-table tr.highlight-team { background:#29220e; }
body.dark-mode .match.has-event-alert { background:#35131d; }
body.dark-mode .filters,body.dark-mode .league-select-wrap { background:var(--app-bg); }
body.dark-mode .filter-btn,body.dark-mode #leagueSelect,body.dark-mode .league-block,body.dark-mode .league-list-item,body.dark-mode .detail-card,body.dark-mode .detail-score-card { background:var(--surface); color:var(--text); border-color:var(--line); }
/* Light silver-grey card framing around league sections; preserve the dark league-name strip */
body.dark-mode .league-block { border:2px solid #C4C8CC !important; border-radius:10px; box-shadow:0 0 0 1px rgba(196,200,204,.35); }
body.dark-mode .league-header { background:#202020 !important; color:#f5f5f5 !important; border-bottom:1px solid #383838 !important; }
body.dark-mode .league-header .league-name, body.dark-mode .league-header .league-country { color:#f5f5f5 !important; opacity:1 !important; }
body.dark-mode .match { background:#D1D5D9 !important; color:#111111 !important; border-color:#B7BCC1 !important; }
body.dark-mode .match .team-name, body.dark-mode .match .match-time, body.dark-mode .match .vs, body.dark-mode .match .score { color:#111111; }
body.dark-mode .match .live-label, body.dark-mode .match .live-score { color:#c00000 !important; }
body.dark-mode .match:active { background:#BFC4C9 !important; }
body.dark-mode .league-header .league-name, body.dark-mode .league-header .league-country { color:#111111 !important; opacity:1 !important; }
body.dark-mode .league-block + .league-block { border-top:1px solid #C4C8CC !important; }
body.dark-mode .match.has-event-alert { background:#431b2a; }
body.dark-mode .match-event-alert { color:#fff; }
body.dark-mode .team.goal-scored .team-name { color:#ff8a9c; }
body.dark-mode .status-message,body.dark-mode .match-time,body.dark-mode .vs { color:var(--muted); }
.theme-btn { border:0; background:transparent; color:inherit; }
.details-top { display:flex; justify-content:space-between; align-items:center; padding:12px 10px; }

<script>

/* =========================
   DS GOAL BACKEND
========================= */

const API_BASE =
  "https://football-livescore-backend.vercel.app/api/fixtures";


/* =========================
   APP STATE
========================= */

let selectedDate = localStorage.getItem("sawaGoalSelectedDate") || getNigeriaDate();

let allMatches = [];

let currentFilter = ["all", "live", "upcoming", "finished"].includes(localStorage.getItem("sawaGoalFilter")) ? localStorage.getItem("sawaGoalFilter") : "all";

let leagueCache = [];
let favourites = loadFavourites();
let currentDetailMatch = null;
let currentPage = "matches";

// Score baseline prevents a goal alert on first load.
let previousScores = Object.create(null);
let goalAlerts = Object.create(null);
let pendingGoalAlerts = Object.create(null);
let hasScoreBaseline = false;
let isLoadingFixtures = false;
let eventAlerts = Object.create(null);
let seenEventKeys = Object.create(null);
let hasEventBaseline = false;
let lastEventPollAt = 0;
let isEventPollRunning = false;


/* =========================
   NIGERIA DATE
========================= */

function getNigeriaDate(date = new Date()) {

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Lagos",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(date);

}


/* =========================
   DATE BAR
========================= */

function buildDateBar() {

  const bar = document.getElementById("dateBar");

  bar.innerHTML = "";

  const today = new Date(
    new Date().toLocaleString("en-US", {
      timeZone: "Africa/Lagos"
    })
  );

  for (let i = 0; i < 14; i++) {

    const date = new Date(today);

    date.setDate(today.getDate() + i);

    const dateString = getNigeriaDate(date);

    const dayName = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      weekday: "short"
    }).format(date);

    const dayNumber = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      day: "2-digit"
    }).format(date);

    const monthName = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      month: "short"
    }).format(date);

    const item = document.createElement("div");

    item.className =
      "date-item " +
      (dateString === selectedDate ? "active" : "");

    item.innerHTML = `
      <div class="day">
        ${i === 0 ? "TODAY" : dayName.toUpperCase()}
      </div>

      <div class="date">
        ${dayNumber} ${monthName.toUpperCase()}
      </div>
    `;

    item.onclick = function() {

      selectedDate = dateString;

      document
        .querySelectorAll(".date-item")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      loadFixtures();

    };

    bar.appendChild(item);

  }

}


/* =========================
   LOAD FIXTURES
========================= */

async function loadFixtures() {

  // Prevent overlapping requests on slow phones or connections.
  if (isLoadingFixtures) return;
  isLoadingFixtures = true;

  const content = document.getElementById("matchesContent");
  const hadMatches = allMatches.length > 0;

  // Only show a loader on the very first load. Refreshes never clear the screen.
  if (!hadMatches && !content.dataset.initialLoading) {
    content.dataset.initialLoading = "true";
    content.innerHTML = `<div class="status-message">Loading real fixtures...</div>`;
  }

  try {
    const requestUrl = currentFilter === "live"
      ? "https://football-livescore-backend.vercel.app/api/football"
      : API_BASE + "?date=" + encodeURIComponent(selectedDate);

    const response = await fetch(requestUrl, { cache: "no-store" });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.error || "Football API request failed");
    }
    if (!Array.isArray(data.response)) {
      throw new Error("Unexpected API response");
    }

    const freshMatches = data.response;
    const now = Date.now();

    // Detect newly increased scores once per fixture/team. Existing scores on
    // first load are recorded quietly, so opening the app won't show false goals.
    const freshScores = Object.create(null);
    freshMatches.forEach(match => {
      const fixtureId = String(match.fixture?.id || "");
      if (!fixtureId) return;
      const homeScore = Number(match.goals?.home ?? 0);
      const awayScore = Number(match.goals?.away ?? 0);
      freshScores[fixtureId] = { home: homeScore, away: awayScore };

      if (hasScoreBaseline && previousScores[fixtureId]) {
        const old = previousScores[fixtureId];
        if (homeScore > old.home) {
          const homeKey = fixtureId + "_home", awayKey = fixtureId + "_away";
          goalAlerts[homeKey] = now + 12000;
          delete goalAlerts[awayKey]; delete pendingGoalAlerts[homeKey]; delete pendingGoalAlerts[awayKey];
        } else if (awayScore > old.away) {
          const homeKey = fixtureId + "_home", awayKey = fixtureId + "_away";
          goalAlerts[awayKey] = now + 12000;
          delete goalAlerts[homeKey]; delete pendingGoalAlerts[homeKey]; delete pendingGoalAlerts[awayKey];
        }
      }
    });

    previousScores = freshScores;
    hasScoreBaseline = true;

    // Expire temporary goal labels while keeping the updated score visible.
    Object.keys(goalAlerts).forEach(key => {
      if (goalAlerts[key] <= now) delete goalAlerts[key];
    });
    Object.keys(pendingGoalAlerts).forEach(key => {
      if (pendingGoalAlerts[key].expiresAt <= now) delete pendingGoalAlerts[key];
    });

    allMatches = freshMatches;
    updateLeagueSelect();
    renderMatches();
    // Event polling is throttled and limited to live fixtures to reduce API usage.
    refreshLiveEventAlerts(freshMatches);

  } catch (error) {
    console.error("DS GOAL fixture refresh failed:", error);
    // Do not erase working results because a background refresh failed.
    if (!hadMatches) {
      content.innerHTML = `<div class="error-message"><strong>Unable to load fixtures.</strong><br><br>${escapeHtml(error.message)}</div>`;
    }
  } finally {
    isLoadingFixtures = false;
  }
}


/* =========================
   LIVE MATCH EVENT ALERTS
========================= */

function classifyMatchEvent(event) {
  const type = String(event?.type || "").toLowerCase();
  const detail = String(event?.detail || "").toLowerCase();
  const comments = String(event?.comments || "").toLowerCase();
  const text = detail + " " + comments;

  if (type === "var" || text.includes("var") || text.includes("video assistant")) {
    return { label: "📺 VAR CHECK", kind: "var" };
  }
  if (type === "card" && (text.includes("red") || text.includes("second yellow"))) {
    return { label: "🟥 RED CARD!", kind: "red-card" };
  }
  if (text.includes("penalty") || text.includes("pen.") || text.includes("penalty awarded")) {
    return { label: "⚠️ PENALTY!", kind: "penalty" };
  }
  if (type === "goal") {
    return { label: "⚽ GOAL!", kind: "goal" };
  }
  return null;
}

function getEventSignature(fixtureId, event) {
  return [
    fixtureId,
    event?.time?.elapsed ?? "",
    event?.time?.extra ?? "",
    event?.team?.id ?? event?.team?.name ?? "",
    event?.player?.id ?? event?.player?.name ?? "",
    event?.type ?? "",
    event?.detail ?? "",
    event?.comments ?? ""
  ].join("|");
}

async function refreshLiveEventAlerts(matches) {
  const now = Date.now();
  if (isEventPollRunning || now - lastEventPollAt < 15000) return;
  lastEventPollAt = now;
  isEventPollRunning = true;

  try {
    const liveMatches = matches.filter(match => isLive(match) && match.fixture?.id).slice(0, 20);
    const results = await Promise.all(liveMatches.map(async match => {
      const fixtureId = String(match.fixture.id);
      try {
        const response = await fetch(
          "https://football-livescore-backend.vercel.app/api/events?fixture=" + encodeURIComponent(fixtureId),
          { cache: "no-store" }
        );
        if (!response.ok) return { fixtureId, events: [] };
        const data = await response.json();
        return { fixtureId, events: Array.isArray(data.response) ? data.response : [] };
      } catch (error) {
        console.warn("DS GOAL event refresh failed:", fixtureId, error);
        return { fixtureId, events: [] };
      }
    }));

    const newAlerts = Object.create(null);
    const pollTime = Date.now();
    for (const result of results) {
      // Process in match timeline order so the newest relevant incident wins.
      const events = result.events.slice().sort((a, b) => {
        const ae = Number(a?.time?.elapsed || 0) * 100 + Number(a?.time?.extra || 0);
        const be = Number(b?.time?.elapsed || 0) * 100 + Number(b?.time?.extra || 0);
        return ae - be;
      });
      for (const event of events) {
        const signature = getEventSignature(result.fixtureId, event);
        const classification = classifyMatchEvent(event);
        if (!seenEventKeys[signature]) {
          seenEventKeys[signature] = true;
          if (hasEventBaseline && classification) {
            if (classification.kind === "goal") {
              const fixture = matches.find(match => String(match.fixture?.id || "") === result.fixtureId);
              const scoringTeamId = String(event?.team?.id || "");
              let side = "";
              if (fixture && scoringTeamId && String(fixture.teams?.home?.id || "") === scoringTeamId) side = "home";
              if (fixture && scoringTeamId && String(fixture.teams?.away?.id || "") === scoringTeamId) side = "away";
              if (side) {
                const goalKey = result.fixtureId + "_" + side;
                const otherSideKey = result.fixtureId + (side === "home" ? "_away" : "_home");
                // Show only one pending goal dot per match: the team attached to the latest detected goal event.
                delete pendingGoalAlerts[otherSideKey];
                // If the score has already changed, keep the confirmed GOAL label instead of reverting to a dot.
                if (!(goalAlerts[goalKey] > pollTime)) {
                  const minute = event?.time?.elapsed ? String(event.time.elapsed) + "'" : "";
                  pendingGoalAlerts[goalKey] = { expiresAt: pollTime + 5000, minute };
                  // Quickly change the detected dot to a GOAL label without waiting for score polling.
                  setTimeout(() => {
                    if (pendingGoalAlerts[goalKey] && pendingGoalAlerts[goalKey].minute === minute) {
                      delete pendingGoalAlerts[goalKey];
                      delete pendingGoalAlerts[otherSideKey];
                      goalAlerts[goalKey] = Date.now() + 12000;
                      renderMatches();
                    }
                  }, 900);
                }
              }
            } else {
              newAlerts[result.fixtureId] = {
                ...classification,
                expiresAt: pollTime + 20000,
                minute: event?.time?.elapsed ? String(event.time.elapsed) + "'" : ""
              };
            }
          }
        }
      }
    }
    hasEventBaseline = true;
    Object.assign(eventAlerts, newAlerts);
    Object.keys(eventAlerts).forEach(fixtureId => {
      if (eventAlerts[fixtureId].expiresAt <= pollTime) delete eventAlerts[fixtureId];
    });
    if (Object.keys(newAlerts).length || Object.keys(eventAlerts).length || Object.keys(pendingGoalAlerts).length) renderMatches();
  } finally {
    isEventPollRunning = false;
  }
}

/* =========================
   FILTER BUTTONS
========================= */

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener("click", function() {

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      this.classList.add("active");

      const previousFilter = currentFilter;
      currentFilter = this.dataset.filter;
      localStorage.setItem("sawaGoalFilter", currentFilter);

      if (currentFilter === "live" || previousFilter === "live") {
        loadFixtures();
      } else {
        renderMatches();
      }

    });

  });


/* =========================
   GET MATCH STATUS
========================= */

function getMatchStatus(match) {

  return (
    match.fixture &&
    match.fixture.status &&
    match.fixture.status.short
  ) || "";

}


function isLive(match) {

  const status =
    getMatchStatus(match);

  return [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P"
  ].includes(status);

}


function isFinished(match) {

  const status =
    getMatchStatus(match);

  return [
    "FT",
    "AET",
    "PEN"
  ].includes(status);

}


function isUpcoming(match) {

  const status =
    getMatchStatus(match);

  return [
    "NS",
    "TBD"
  ].includes(status);

}


/* =========================
   RENDER MATCHES
========================= */

function renderMatches() {

  const content =
    document.getElementById("matchesContent");

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const selectedLeague =
    document
      .getElementById("leagueSelect")
      .value;

  let matches =
    [...allMatches];


  /* FILTER STATUS */

  if (currentFilter === "live") {

    matches =
      matches.filter(isLive);

  }

  if (currentFilter === "finished") {

    matches =
      matches.filter(isFinished);

  }

  if (currentFilter === "upcoming") {

    matches =
      matches.filter(isUpcoming);

  }


  /* FILTER LEAGUE */

  if (selectedLeague !== "all") {

    matches =
      matches.filter(match =>
        String(match.league?.id) ===
        selectedLeague
      );

  }


  /* SEARCH */

  if (search) {

    matches =
      matches.filter(match => {

        const home =
          match.teams?.home?.name
          ?.toLowerCase() || "";

        const away =
          match.teams?.away?.name
          ?.toLowerCase() || "";

        const league =
          match.league?.name
          ?.toLowerCase() || "";

        return (
          home.includes(search) ||
          away.includes(search) ||
          league.includes(search)
        );

      });

  }


  if (matches.length === 0) {

    content.innerHTML = `
      <div class="status-message">
        No matches found for this selection. Check another date or filter.
      </div>
    `;

    return;

  }


  /* GROUP BY LEAGUE */

  const groups = {};

  matches.forEach(match => {

    const leagueId =
      match.league?.id || "unknown";

    if (!groups[leagueId]) {

      groups[leagueId] = [];

    }

    groups[leagueId].push(match);

  });


  content.innerHTML = "";


  Object.values(groups).forEach(group => {

    const first = group[0];

    const leagueBlock =
      document.createElement("section");

    leagueBlock.className =
      "league-block";


    const logo =
      first.league?.logo || "";

    const leagueName =
      first.league?.name ||
      "Unknown League";

    const country =
      first.league?.country ||
      "";


    leagueBlock.innerHTML = `
      <div class="league-header">

        ${
          logo
          ? `<img
              class="league-logo"
              src="${escapeAttribute(logo)}"
              onerror="this.style.display='none'"
            >`
          : ""
        }

        <div class="league-name">
          ${escapeHtml(leagueName)}
        </div>

        <div class="league-country">
          ${escapeHtml(country)}
        </div>

      </div>
    `;


    group.forEach(match => {

      leagueBlock.appendChild(
        createMatchElement(match)
      );

    });


    content.appendChild(
      leagueBlock
    );

  });

}


/* =========================
   MATCH ELEMENT
========================= */

function createMatchElement(match) {

  const row =
    document.createElement("div");

  row.className = "match";
  const fixtureId = String(match.fixture?.id || "");
  const activeEventAlert = eventAlerts[fixtureId];
  if (activeEventAlert && activeEventAlert.expiresAt > Date.now()) {
    row.classList.add("has-event-alert");
  }

  const status =
    getMatchStatus(match);

  const live =
    isLive(match);

  const finished =
    isFinished(match);


  let timeText = "";

  if (live) {

    const elapsed =
      match.fixture?.status?.elapsed;

    timeText =
      `<span class="live-label">
        LIVE
        ${elapsed ? `<br>${elapsed}'` : ""}
       </span>`;

  } else {

    const timestamp =
      match.fixture?.timestamp;

    if (timestamp) {

      timeText =
        new Intl.DateTimeFormat("en-NG", {
          timeZone: "Africa/Lagos",
          hour: "numeric",
          minute: "2-digit"
        }).format(
          new Date(timestamp * 1000)
        );

    } else {

      timeText = status || "";

    }

  }


  const home =
    match.teams?.home;

  const away =
    match.teams?.away;


  const homeScore =
    match.goals?.home;

  const awayScore =
    match.goals?.away;


  let scoreHTML = "";

  if (
    live ||
    finished ||
    homeScore !== null ||
    awayScore !== null
  ) {

    scoreHTML = `
      <div class="score ${live ? "live-score" : ""}">
        ${homeScore ?? 0}
        -
        ${awayScore ?? 0}
      </div>
    `;

  } else {

    scoreHTML = `
      <div class="score vs">
        VS
      </div>
    `;

  }


  row.innerHTML = `

    <div class="match-time">
      ${timeText}
    </div>


    <div class="team home ${goalAlerts[String(match.fixture?.id || "") + "_home"] > Date.now() ? "goal-scored" : ""}">

      <span class="team-name">${escapeHtml(home?.name || "Home")}</span>
      ${goalAlerts[String(match.fixture?.id || "") + "_home"] > Date.now()
        ? '<span class="goal-alert confirmed">⚽ GOAL</span>'
        : pendingGoalAlerts[String(match.fixture?.id || "") + "_home"]?.expiresAt > Date.now()
          ? '<span class="goal-alert pending" aria-label="Goal detected, awaiting score confirmation"><span class="goal-dot"></span></span>'
          : ""}

      ${
        home?.logo
        ? `<img
            class="team-logo"
            src="${escapeAttribute(home.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

    </div>


    ${scoreHTML}


    <div class="team away ${goalAlerts[String(match.fixture?.id || "") + "_away"] > Date.now() ? "goal-scored" : ""}">

      ${
        away?.logo
        ? `<img
            class="team-logo"
            src="${escapeAttribute(away.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

      <span class="team-name">${escapeHtml(away?.name || "Away")}</span>
      ${goalAlerts[String(match.fixture?.id || "") + "_away"] > Date.now()
        ? '<span class="goal-alert confirmed">⚽ GOAL</span>'
        : pendingGoalAlerts[String(match.fixture?.id || "") + "_away"]?.expiresAt > Date.now()
          ? '<span class="goal-alert pending" aria-label="Goal detected, awaiting score confirmation"><span class="goal-dot"></span></span>'
          : ""}

    </div>


    <button class="fav-star" aria-label="Save favourite" onclick="event.stopPropagation(); toggleFavourite('${fixtureId}')">${favourites[fixtureId] ? "★" : "☆"}</button>


  `;


  row.setAttribute("role", "button");
  row.setAttribute("tabindex", "0");
  row.addEventListener("click", () => openMatchDetails(fixtureId));
  row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMatchDetails(fixtureId); } });
  return row;

}


/* =========================
   LEAGUE SELECT
========================= */

function updateLeagueSelect() {

  const select =
    document.getElementById("leagueSelect");

  const currentValue =
    select.value;

  select.innerHTML = `
    <option value="all">
      ⚽ All Leagues
    </option>
  `;


  const leagues = {};

  allMatches.forEach(match => {

    const id =
      match.league?.id;

    if (!id) return;

    leagues[id] = {
      name:
        match.league?.name ||
        "Unknown League",
      country:
        match.league?.country ||
        ""
    };

  });


  Object.entries(leagues)
    .sort((a,b) =>
      a[1].name.localeCompare(
        b[1].name
      )
    )
    .forEach(([id, league]) => {

      const option =
        document.createElement("option");

      option.value = id;

      option.textContent =
        league.country
        ? `${league.name} - ${league.country}`
        : league.name;

      select.appendChild(option);

    });


  if (
    [...select.options]
      .some(option =>
        option.value === currentValue
      )
  ) {

    select.value =
      currentValue;

  }

}


/* =========================
   LEAGUES PAGE
========================= */

async function loadLeagues() {

  const status =
    document.getElementById(
      "leaguesStatus"
    );

  const list =
    document.getElementById(
      "leagueList"
    );


  if (leagueCache.length > 0) {

    renderLeagueList();

    return;

  }


  status.textContent =
    "Loading real leagues...";


  try {

    const response =
      await fetch(
        "https://football-livescore-backend.vercel.app/api/leagues"
      );

    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        "Unable to load leagues"
      );

    }


    leagueCache =
      data.response || [];


    renderLeagueList();


  } catch (error) {

    status.innerHTML = `
      <div class="error-message">
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


function renderLeagueList() {

  const status =
    document.getElementById(
      "leaguesStatus"
    );

  const list =
    document.getElementById(
      "leagueList"
    );


  status.style.display =
    "none";

  list.innerHTML = "";


  leagueCache.forEach(item => {

    const league =
      item.league;

    const country =
      item.country;


    if (!league) return;


    const div =
      document.createElement("div");

    div.className =
      "league-list-item";


    div.innerHTML = `

      ${
        league.logo
        ? `<img
            src="${escapeAttribute(league.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

      <div>
        <strong>
          ${escapeHtml(league.name || "")}
        </strong>

        <br>

        <small>
          ${escapeHtml(country?.name || "")}
        </small>
      </div>

    `;


    list.appendChild(div);

  });

}

function showPage(page, element) {
  currentPage = page;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));

  if (pageEl) pageEl.classList.add("active");
  if (element) element.classList.add("active");
  if (page === "leagues") loadLeagues();
  if (page === "favourites") renderFavourites();
}

/* =========================
   THEME + FAVOURITES
========================= */
function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  const dark = document.body.classList.contains("dark-mode");
  localStorage.setItem("sawaGoalTheme", dark ? "dark" : "light");
  document.getElementById("themeButton").textContent = dark ? "☀" : "☾";
}
function loadFavourites() {
  try { return JSON.parse(localStorage.getItem("sawaGoalFavourites") || "{}"); } catch (_) { return {}; }
}
function saveFavourites() { localStorage.setItem("sawaGoalFavourites", JSON.stringify(favourites)); }
function toggleFavourite(id) {
  const match = allMatches.find(m => String(m.fixture?.id) === String(id));
  if (favourites[id]) delete favourites[id];
  else if (match) favourites[id] = match;
  saveFavourites(); renderMatches();
  if (currentPage === "favourites") renderFavourites();
  if (currentDetailMatch && String(currentDetailMatch.fixture?.id) === String(id)) updateDetailFavouriteButton();
}
function renderFavourites() {
  const el = document.getElementById("favouritesContent");
  const items = Object.values(favourites);
  el.innerHTML = "";
  if (!items.length) { el.innerHTML = '<div class="status-message">No favourite matches saved yet. Tap ☆ beside any match to save it.</div>'; return; }
  items.forEach(match => el.appendChild(createMatchElement(match)));
}
function toggleCurrentFavourite() { if (currentDetailMatch) toggleFavourite(String(currentDetailMatch.fixture?.id)); }
function updateDetailFavouriteButton() {
  const id = String(currentDetailMatch?.fixture?.id || "");
  const b = document.getElementById("detailFavButton");
  if (b) b.textContent = favourites[id] ? "★ Saved" : "☆ Favourite";
}
function closeMatchDetails() {
  document.getElementById("detailsPage").classList.remove("active");
  document.getElementById((currentPage === "favourites" ? "favourites" : "matches") + "Page").classList.add("active");
  currentDetailMatch = null;
}
async function openMatchDetails(id) {
  const match = allMatches.find(m => String(m.fixture?.id) === String(id)) || favourites[id];
  if (!match) return;
  currentDetailMatch = match;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("detailsPage").classList.add("active");
  updateDetailFavouriteButton();
  const el = document.getElementById("matchDetailsContent");
  const home = match.teams?.home || {}, away = match.teams?.away || {}, league = match.league || {}, fixture = match.fixture || {};
  const score = match.goals?.home != null || match.goals?.away != null ? `${match.goals?.home ?? 0} - ${match.goals?.away ?? 0}` : "VS";
  const kickoff = fixture.timestamp ? new Intl.DateTimeFormat("en-NG", {timeZone:"Africa/Lagos",dateStyle:"medium",timeStyle:"short"}).format(new Date(fixture.timestamp*1000)) : "Time unavailable";
  el.innerHTML = `<div class="detail-score-card"><div class="detail-teams"><div class="detail-team">${home.logo?`<img src="${escapeAttribute(home.logo)}" onerror="this.style.display='none'">`:''}${escapeHtml(home.name||"Home")}</div><div class="detail-score">${escapeHtml(score)}</div><div class="detail-team">${away.logo?`<img src="${escapeAttribute(away.logo)}" onerror="this.style.display='none'">`:''}${escapeHtml(away.name||"Away")}</div></div><div class="detail-status">${escapeHtml(fixture.status?.long || fixture.status?.short || "Status unavailable")} ${fixture.status?.elapsed ? "· "+fixture.status.elapsed+"'" : ""}</div></div>
  <div class="detail-tabs" role="tablist" aria-label="Match information">
    <button class="detail-tab active" role="tab" aria-selected="true" onclick="switchMatchTab(this,'overview')">Overview</button>
    <button class="detail-tab" role="tab" aria-selected="false" onclick="switchMatchTab(this,'stats')">Stats</button>
    <button class="detail-tab" role="tab" aria-selected="false" onclick="switchMatchTab(this,'lineups')">Lineups</button>
    <button class="detail-tab" role="tab" aria-selected="false" onclick="switchMatchTab(this,'h2h')">H2H</button>
    <button class="detail-tab" role="tab" aria-selected="false" onclick="switchMatchTab(this,'standings')">Table</button>
  </div>
  <section class="detail-card detail-tab-section" data-tab-section="overview"><h3>Match Overview</h3>${detailRow("Competition", league.name||"Unavailable")}${detailRow("Country", league.country||"Unavailable")}${detailRow("Round", league.round||"Unavailable")}${detailRow("Kick-off", kickoff)}${detailRow("Venue", fixture.venue?.name||"Unavailable")}${detailRow("City", fixture.venue?.city||"Unavailable")}${detailRow("Referee", fixture.referee||"Unavailable")}${detailRow("Status", fixture.status?.long||"Unavailable")}</section>
  <section class="detail-card detail-tab-section" data-tab-section="overview"><h3>Match Events</h3><div id="detailEvents" class="detail-loading">Loading events…</div></section>
  <section class="detail-card detail-tab-section" data-tab-section="h2h" hidden><h3>Head to Head · Last 5</h3><div id="detailH2H" class="detail-loading">Loading previous meetings…</div></section>
  <section class="detail-card detail-tab-section" data-tab-section="h2h" hidden><h3>Last 5 Matches · Team Form</h3><div id="detailForm" class="detail-loading">Loading recent matches…</div></section>
  <section class="detail-card detail-tab-section" data-tab-section="standings" hidden><h3>League Table</h3><div id="detailStandings" class="detail-loading">Loading league table…</div></section>
  <section class="detail-card detail-tab-section" data-tab-section="stats" hidden><h3>Match Statistics</h3><div id="detailStats" class="detail-loading">Loading statistics…</div></section>
  <section class="detail-card detail-tab-section" data-tab-section="lineups" hidden><h3>Lineups</h3><div id="detailLineups" class="detail-loading">Loading lineups…</div></section>`;
  const fixtureId = String(fixture.id || id);
  const base = "https://football-livescore-backend.vercel.app/api/";
  const homeId = String(home.id || ""), awayId = String(away.id || "");
  const season = Number(league.season || (fixture.timestamp ? new Date(fixture.timestamp * 1000).getUTCFullYear() : new Date().getUTCFullYear()));
  const leagueId = String(league.id || "");
  await Promise.all([
    loadDetailSection("detailEvents", base+"events?fixture="+encodeURIComponent(fixtureId), data => renderEvents(data.response||[])),
    loadDetailSection("detailStats", base+"statistics?fixture="+encodeURIComponent(fixtureId), data => renderStatistics(data.response||[])),
    loadDetailSection("detailLineups", base+"lineups?fixture="+encodeURIComponent(fixtureId), data => renderLineups(data.response||[])),
    loadDetailSection("detailH2H", base+"headtohead?home="+encodeURIComponent(homeId)+"&away="+encodeURIComponent(awayId), data => renderRecentMatches(data.response||[], homeId, awayId, true)),
    loadDetailSection("detailForm", base+"teamlast?home="+encodeURIComponent(homeId)+"&away="+encodeURIComponent(awayId)+"&season="+encodeURIComponent(season), data => renderTeamForms(data.home||[], data.away||[], home.name||"Home", away.name||"Away", homeId, awayId)),
    loadDetailSection("detailStandings", base+"standings?league="+encodeURIComponent(leagueId)+"&season="+encodeURIComponent(season), data => renderStandings(data.response||[], homeId, awayId))
  ]);
}

function switchMatchTab(button, tab) {
  document.querySelectorAll(".detail-tab").forEach(item => {
    const active = item === button;
    item.classList.toggle("active", active);
    item.setAttribute("aria-selected", active ? "true" : "false");
  });
  document.querySelectorAll(".detail-tab-section").forEach(section => {
    section.hidden = section.dataset.tabSection !== tab;
  });
}

function detailRow(label,value) { return `<div class="detail-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value||"Unavailable")}</strong></div>`; }
async function loadDetailSection(id,url,render) {
  const el=document.getElementById(id); if(!el) return;
  try { const r=await fetch(url,{cache:"no-store"}); const d=await r.json(); if(!r.ok) throw new Error(d.message||d.error||"Unavailable"); const html=render(d); if(document.getElementById(id)) document.getElementById(id).innerHTML=html||'<div class="detail-loading">No information provided for this match yet.</div>'; }
  catch(_) { if(document.getElementById(id)) document.getElementById(id).innerHTML='<div class="detail-loading">This information is unavailable from the provider for this match.</div>'; }
}
function renderEvents(events) {
  if(!events.length) return '<div class="detail-loading">No match events available yet.</div>';
  return events.map(e=>`<div class="event-row"><strong>${escapeHtml((e.time?.elapsed??"")+"'"+(e.time?.extra?" +"+e.time.extra: ""))}</strong><span>${escapeHtml(e.team?.name||"")}<br>${escapeHtml(e.player?.name||"")}</span><span>${escapeHtml(e.type||"")} · ${escapeHtml(e.detail||"")}${e.assist?.name?"<br>Assist: "+escapeHtml(e.assist.name):""}</span></div>`).join("");
}
function renderStatistics(teams) {
  if(!teams.length) return '<div class="detail-loading">Statistics are not available yet.</div>';
  const names=teams.map(t=>t.team?.name||"Team"); const a=teams[0]?.statistics||[], b=teams[1]?.statistics||[];
  const values={}; a.forEach(x=>values[x.type]=[x.value,"–"]); b.forEach(x=>{if(!values[x.type])values[x.type]=["–","–"];values[x.type][1]=x.value;});
  return `<div class="detail-row"><strong>${escapeHtml(names[0]||"Home")}</strong><strong>${escapeHtml(names[1]||"Away")}</strong></div>`+Object.entries(values).map(([k,v])=>detailRow(k,`${v[0]??"–"}   |   ${v[1]??"–"}`)).join("");
}
function renderLineups(teams) {
  if(!teams.length) return '<div class="detail-loading">Lineups are usually available shortly before kick-off; none were returned.</div>';
  return teams.map(t=>`<div class="detail-row"><strong>${escapeHtml(t.team?.name||"Team")}</strong><span>${escapeHtml(t.formation||"Formation unavailable")}</span></div><div class="detail-row"><span>Coach</span><span>${escapeHtml(t.coach?.name||"Unavailable")}</span></div><div class="detail-row"><span>Starting XI</span><span>${(t.startXI||[]).map(p=>escapeHtml(p.player?.name||"")).join(", ")||"Unavailable"}</span></div><div class="detail-row"><span>Substitutes</span><span>${(t.substitutes||[]).map(p=>escapeHtml(p.player?.name||"")).join(", ")||"Unavailable"}</span></div>`).join("");
}

function resultBadge(match, teamId) {
  const homeId = String(match.teams?.home?.id || "");
  const awayId = String(match.teams?.away?.id || "");
  const h = Number(match.goals?.home ?? 0), a = Number(match.goals?.away ?? 0);
  if (match.fixture?.status?.short !== "FT" && match.fixture?.status?.short !== "AET" && match.fixture?.status?.short !== "PEN") return "–";
  const score = homeId === teamId ? h - a : a - h;
  return score > 0 ? "W" : score < 0 ? "L" : "D";
}
function renderRecentMatches(matches, homeId, awayId, h2h=false) {
  if (!matches.length) return '<div class="detail-loading">No previous meetings are available for this fixture.</div>';
  return matches.slice(0,5).map(m => {
    const date = m.fixture?.timestamp ? new Intl.DateTimeFormat("en-NG",{timeZone:"Africa/Lagos",day:"numeric",month:"short",year:"numeric"}).format(new Date(m.fixture.timestamp*1000)) : "Date unavailable";
    const hs = m.goals?.home ?? "–", as = m.goals?.away ?? "–";
    const comp = m.league?.name || "";
    return `<div class="event-row"><strong>${escapeHtml(date)}</strong><span>${escapeHtml(m.teams?.home?.name||"Home")}<br><b>${escapeHtml(hs)} - ${escapeHtml(as)}</b><br>${escapeHtml(m.teams?.away?.name||"Away")}</span><span>${escapeHtml(comp)}<br>${escapeHtml(m.fixture?.status?.short||"")}</span></div>`;
  }).join("");
}
function renderTeamForms(homeMatches, awayMatches, homeName, awayName, homeId, awayId) {
  const one = (name, matches, teamId) => `<div class="form-team"><h4>${escapeHtml(name)}</h4>${matches.slice(0,5).map(m=>{const r=resultBadge(m,teamId);const cls=r==="W"?"form-w":r==="L"?"form-l":r==="D"?"form-d":"form-na";return `<div class="event-row"><span>${escapeHtml(m.fixture?.date ? m.fixture.date.slice(0,10) : "Recent")}</span><span>${escapeHtml(m.teams?.home?.name||"")} ${escapeHtml(m.goals?.home??"–")}-${escapeHtml(m.goals?.away??"–")} ${escapeHtml(m.teams?.away?.name||"")}</span><b class="${cls}">${r}</b></div>`}).join("")||'<div class="detail-loading">No recent matches available.</div>'}</div>`;
  return one(homeName,homeMatches,String(homeId||""))+one(awayName,awayMatches,String(awayId||""));
}
function renderStandings(response, homeTeamId, awayTeamId) {
  // API-Football may return multiple groups (e.g. group-stage competitions).
  // Flatten every group so the complete table is shown, not just the first one.
  const groups = (response || []).flatMap(item => item?.league?.standings || []);
  const standings = groups.flatMap(group => Array.isArray(group) ? group : []);
  if (!standings.length) return '<div class="detail-loading">Full league standings are not available for this competition or season.</div>';
  const homeId = String(homeTeamId || ""), awayId = String(awayTeamId || "");
  const homeRow = standings.find(row => String(row.team?.id) === homeId);
  const awayRow = standings.find(row => String(row.team?.id) === awayId);
  const positionNote = `<div class="standings-position-note">${homeRow ? `<span><b>${escapeHtml(homeRow.team?.name || "Home team")}</b>: position <strong>${escapeHtml(homeRow.rank ?? "–")}</strong></span>` : ""}${awayRow ? `<span><b>${escapeHtml(awayRow.team?.name || "Away team")}</b>: position <strong>${escapeHtml(awayRow.rank ?? "–")}</strong></span>` : ""}</div>`;
  const rows = standings.map(row => {
    const id = String(row.team?.id || "");
    const highlighted = (id === homeId || id === awayId) ? "highlight-team" : "";
    return `<tr class="${highlighted}"><td>${escapeHtml(row.rank ?? "–")}</td><td class="standings-team-cell">${row.team?.logo ? `<img src="${escapeAttribute(row.team.logo)}" alt="" onerror="this.style.display='none'">` : ""}${escapeHtml(row.team?.name || "Team")}</td><td>${escapeHtml(row.all?.played ?? "–")}</td><td>${escapeHtml(row.all?.win ?? "–")}</td><td>${escapeHtml(row.all?.draw ?? "–")}</td><td>${escapeHtml(row.all?.lose ?? "–")}</td><td>${escapeHtml(row.all?.goals?.for ?? "–")}</td><td>${escapeHtml(row.all?.goals?.against ?? "–")}</td><td>${escapeHtml(row.goalsDiff ?? "–")}</td><td><b>${escapeHtml(row.points ?? "–")}</b></td></tr>`;
  }).join("");
  return `${positionNote}<div class="table-scroll"><table class="standings-table"><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div><div class="standings-key">P Played · W Won · D Drawn · L Lost · GF Goals for · GA Goals against · GD Goal difference · Pts Points</div>`;
}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START APP
========================= */

if (localStorage.getItem("sawaGoalTheme") === "dark") { document.body.classList.add("dark-mode"); document.getElementById("themeButton").textContent = "☀"; }
buildDateBar();
document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.filter === currentFilter));
loadFixtures();

// Keep scores current without requiring users to press refresh.
setInterval(() => {
  if (document.visibilityState === "visible") loadFixtures();
}, 15000);

</script>
