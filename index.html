<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS GOAL - Live Football Scores</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  color: #111827;
  padding-bottom: 75px;
}

/* HEADER */
.header {
  background: #061b35;
  color: white;
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.menu,
.icon-btn {
  font-size: 24px;
  cursor: pointer;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: #36d46f;
}

.logo-ball {
  color: white;
}

.page-title {
  background: #082544;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 12px;
}

/* DATE BAR */
.date-bar {
  background: #061b35;
  color: white;
  display: flex;
  overflow-x: auto;
  gap: 5px;
  padding: 10px 8px;
  scrollbar-width: none;
}

.date-bar::-webkit-scrollbar {
  display: none;
}

.date-item {
  min-width: 78px;
  text-align: center;
  padding: 9px 5px;
  border-radius: 8px;
  cursor: pointer;
  flex-shrink: 0;
}

.date-item .day {
  font-weight: bold;
  font-size: 13px;
}

.date-item .date {
  font-size: 12px;
  margin-top: 5px;
  opacity: .8;
}

.date-item.active {
  background: #36d46f;
  color: #062038;
}

.date-item.active .date {
  opacity: 1;
}

/* FILTERS */
.filters {
  background: #eef2f5;
  padding: 12px 10px 8px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
}

.filter-btn {
  border: 1px solid #cad3dd;
  background: white;
  border-radius: 20px;
  padding: 9px 15px;
  white-space: nowrap;
  font-size: 13px;
  cursor: pointer;
}

.filter-btn.active {
  background: #36c96a;
  color: white;
  border-color: #36c96a;
  font-weight: bold;
}

/* LEAGUE SELECT */
.league-select-wrap {
  padding: 4px 10px 12px;
  background: #eef2f5;
}

#leagueSelect {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  background: white;
  font-size: 14px;
}

/* CONTENT */
.content {
  padding: 0 10px 20px;
}

.status-message {
  text-align: center;
  padding: 35px 15px;
  color: #667085;
  font-size: 14px;
}

.error-message {
  color: #b42318;
  background: #fee4e2;
  border-radius: 8px;
  padding: 15px;
  margin-top: 10px;
}

/* LEAGUE */
.league-block {
  background: white;
  margin-bottom: 12px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.league-header {
  background: #082c52;
  color: white;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: bold;
}

.league-logo {
  width: 25px;
  height: 25px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
  padding: 2px;
}

.league-name {
  flex: 1;
  font-size: 14px;
}

.league-country {
  font-size: 10px;
  opacity: .75;
}

/* MATCH */
.match {
  min-height: 70px;
  border-bottom: 1px solid #e7ebef;
  display: grid;
  grid-template-columns: 55px 1fr 65px 1fr 20px;
  align-items: center;
  gap: 3px;
  padding: 7px 5px;
}

.match:last-child {
  border-bottom: none;
}

.match-time {
  text-align: center;
  font-size: 11px;
  color: #667085;
}

.live-label {
  color: #e00000;
  font-weight: bold;
  font-size: 11px;
}

.team {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  min-width: 0;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
}

.team-logo {
  width: 25px;
  height: 25px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
}

.live-score {
  color: #d90000;
}

.vs {
  color: #667085;
  font-size: 12px;
}

.arrow {
  color: #8b95a1;
  font-size: 18px;
}

/* SEARCH */
.search-box {
  display: none;
  background: #061b35;
  padding: 8px 10px 12px;
}

.search-box.show {
  display: block;
}

.search-box input {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #061b35;
  color: white;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 200;
  box-shadow: 0 -2px 8px rgba(0,0,0,.15);
}

.nav-item {
  text-align: center;
  font-size: 11px;
  opacity: .8;
  cursor: pointer;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #36d46f;
  opacity: 1;
}

/* LEAGUES PAGE */
.page {
  display: none;
}

.page.active {
  display: block;
}

.league-list-item {
  background: white;
  margin-bottom: 7px;
  padding: 13px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.league-list-item img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

/* DESKTOP */
@media (min-width: 700px) {
  body {
    max-width: 700px;
    margin: auto;
  }

  .bottom-nav {
    max-width: 700px;
    left: 50%;
    transform: translateX(-50%);
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div class="menu">☰</div>
  </div>

  <div class="logo">
    DS <span class="logo-ball">⚽</span><span>OAL</span>
  </div>

  <div class="header-right">
    <div class="icon-btn" onclick="toggleSearch()">⌕</div>
    <div class="icon-btn" onclick="loadFixtures()">↻</div>
  </div>
</header>

<div class="page-title">
  LIVE FOOTBALL SCORES
</div>

<!-- SEARCH -->
<div class="search-box" id="searchBox">
  <input
    type="text"
    id="searchInput"
    placeholder="Search team or league..."
    oninput="renderMatches()"
  >
</div>

<!-- MATCHES PAGE -->
<div id="matchesPage" class="page active">

  <!-- DATE BAR -->
  <div class="date-bar" id="dateBar"></div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">
      All
    </button>

    <button class="filter-btn" data-filter="live">
      🔴 Live
    </button>

    <button class="filter-btn" data-filter="upcoming">
      ◷ Upcoming
    </button>

    <button class="filter-btn" data-filter="finished">
      ⚑ Finished
    </button>
  </div>

  <!-- LEAGUE SELECT -->
  <div class="league-select-wrap">
    <select id="leagueSelect" onchange="renderMatches()">
      <option value="all">⚽ All Leagues</option>
    </select>
  </div>

  <!-- MATCH CONTENT -->
  <main class="content" id="matchesContent">
    <div class="status-message">
      Loading fixtures...
    </div>
  </main>

</div>

<!-- LEAGUES PAGE -->
<div id="leaguesPage" class="page">

  <div class="content">
    <div class="status-message" id="leaguesStatus">
      Loading leagues...
    </div>

    <div id="leagueList"></div>
  </div>

</div>

<!-- NEWS PAGE -->
<div id="newsPage" class="page">

  <div class="content">
    <div class="status-message">
      Football news will be added here.
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <div class="nav-item active" onclick="showPage('matches', this)">
    <span class="nav-icon">⚽</span>
    Matches
  </div>

  <div class="nav-item" onclick="showPage('leagues', this)">
    <span class="nav-icon">🏆</span>
    Leagues
  </div>

  <div class="nav-item" onclick="showPage('news', this)">
    <span class="nav-icon">📰</span>
    News
  </div>

</nav>

<script>

/* =========================
   DS GOAL BACKEND
========================= */

const API_BASE =
  "https://football-livescore-backend.vercel.app/api/fixtures";


/* =========================
   APP STATE
========================= */

let selectedDate = getNigeriaDate();

let allMatches = [];

let currentFilter = "all";

let leagueCache = [];


/* =========================
   NIGERIA DATE
========================= */

function getNigeriaDate(date = new Date()) {

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Lagos",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(date);

}


/* =========================
   DATE BAR
========================= */

function buildDateBar() {

  const bar = document.getElementById("dateBar");

  bar.innerHTML = "";

  const today = new Date(
    new Date().toLocaleString("en-US", {
      timeZone: "Africa/Lagos"
    })
  );

  for (let i = 0; i < 7; i++) {

    const date = new Date(today);

    date.setDate(today.getDate() + i);

    const dateString = getNigeriaDate(date);

    const dayName = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      weekday: "short"
    }).format(date);

    const dayNumber = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      day: "2-digit"
    }).format(date);

    const monthName = new Intl.DateTimeFormat("en-US", {
      timeZone: "Africa/Lagos",
      month: "short"
    }).format(date);

    const item = document.createElement("div");

    item.className =
      "date-item " +
      (dateString === selectedDate ? "active" : "");

    item.innerHTML = `
      <div class="day">
        ${i === 0 ? "TODAY" : dayName.toUpperCase()}
      </div>

      <div class="date">
        ${dayNumber} ${monthName.toUpperCase()}
      </div>
    `;

    item.onclick = function() {

      selectedDate = dateString;

      document
        .querySelectorAll(".date-item")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      loadFixtures();

    };

    bar.appendChild(item);

  }

}


/* =========================
   LOAD FIXTURES
========================= */

async function loadFixtures() {

  const content =
    document.getElementById("matchesContent");

  content.innerHTML = `
    <div class="status-message">
      Loading real fixtures...
    </div>
  `;

  try {

    const response =
      await fetch(
        API_BASE +
        "?date=" +
        encodeURIComponent(selectedDate)
      );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        "Football API request failed"
      );

    }

    if (!data.response) {

      throw new Error(
        "Unexpected API response"
      );

    }

    allMatches = data.response;

    updateLeagueSelect();

    renderMatches();

  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error-message">
        <strong>Unable to load fixtures.</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================
   FILTER BUTTONS
========================= */

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener("click", function() {

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      this.classList.add("active");

      currentFilter =
        this.dataset.filter;

      renderMatches();

    });

  });


/* =========================
   GET MATCH STATUS
========================= */

function getMatchStatus(match) {

  return (
    match.fixture &&
    match.fixture.status &&
    match.fixture.status.short
  ) || "";

}


function isLive(match) {

  const status =
    getMatchStatus(match);

  return [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P"
  ].includes(status);

}


function isFinished(match) {

  const status =
    getMatchStatus(match);

  return [
    "FT",
    "AET",
    "PEN"
  ].includes(status);

}


function isUpcoming(match) {

  const status =
    getMatchStatus(match);

  return [
    "NS",
    "TBD"
  ].includes(status);

}


/* =========================
   RENDER MATCHES
========================= */

function renderMatches() {

  const content =
    document.getElementById("matchesContent");

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const selectedLeague =
    document
      .getElementById("leagueSelect")
      .value;

  let matches =
    [...allMatches];


  /* FILTER STATUS */

  if (currentFilter === "live") {

    matches =
      matches.filter(isLive);

  }

  if (currentFilter === "finished") {

    matches =
      matches.filter(isFinished);

  }

  if (currentFilter === "upcoming") {

    matches =
      matches.filter(isUpcoming);

  }


  /* FILTER LEAGUE */

  if (selectedLeague !== "all") {

    matches =
      matches.filter(match =>
        String(match.league?.id) ===
        selectedLeague
      );

  }


  /* SEARCH */

  if (search) {

    matches =
      matches.filter(match => {

        const home =
          match.teams?.home?.name
          ?.toLowerCase() || "";

        const away =
          match.teams?.away?.name
          ?.toLowerCase() || "";

        const league =
          match.league?.name
          ?.toLowerCase() || "";

        return (
          home.includes(search) ||
          away.includes(search) ||
          league.includes(search)
        );

      });

  }


  if (matches.length === 0) {

    content.innerHTML = `
      <div class="status-message">
        No real fixtures found for this selection.
      </div>
    `;

    return;

  }


  /* GROUP BY LEAGUE */

  const groups = {};

  matches.forEach(match => {

    const leagueId =
      match.league?.id || "unknown";

    if (!groups[leagueId]) {

      groups[leagueId] = [];

    }

    groups[leagueId].push(match);

  });


  content.innerHTML = "";


  Object.values(groups).forEach(group => {

    const first = group[0];

    const leagueBlock =
      document.createElement("section");

    leagueBlock.className =
      "league-block";


    const logo =
      first.league?.logo || "";

    const leagueName =
      first.league?.name ||
      "Unknown League";

    const country =
      first.league?.country ||
      "";


    leagueBlock.innerHTML = `
      <div class="league-header">

        ${
          logo
          ? `<img
              class="league-logo"
              src="${escapeAttribute(logo)}"
              onerror="this.style.display='none'"
            >`
          : ""
        }

        <div class="league-name">
          ${escapeHtml(leagueName)}
        </div>

        <div class="league-country">
          ${escapeHtml(country)}
        </div>

      </div>
    `;


    group.forEach(match => {

      leagueBlock.appendChild(
        createMatchElement(match)
      );

    });


    content.appendChild(
      leagueBlock
    );

  });

}


/* =========================
   MATCH ELEMENT
========================= */

function createMatchElement(match) {

  const row =
    document.createElement("div");

  row.className = "match";


  const status =
    getMatchStatus(match);

  const live =
    isLive(match);

  const finished =
    isFinished(match);


  let timeText = "";

  if (live) {

    const elapsed =
      match.fixture?.status?.elapsed;

    timeText =
      `<span class="live-label">
        LIVE
        ${elapsed ? `<br>${elapsed}'` : ""}
       </span>`;

  } else {

    const timestamp =
      match.fixture?.timestamp;

    if (timestamp) {

      timeText =
        new Intl.DateTimeFormat("en-NG", {
          timeZone: "Africa/Lagos",
          hour: "numeric",
          minute: "2-digit"
        }).format(
          new Date(timestamp * 1000)
        );

    } else {

      timeText = status || "";

    }

  }


  const home =
    match.teams?.home;

  const away =
    match.teams?.away;


  const homeScore =
    match.goals?.home;

  const awayScore =
    match.goals?.away;


  let scoreHTML = "";

  if (
    live ||
    finished ||
    homeScore !== null ||
    awayScore !== null
  ) {

    scoreHTML = `
      <div class="score ${live ? "live-score" : ""}">
        ${homeScore ?? 0}
        -
        ${awayScore ?? 0}
      </div>
    `;

  } else {

    scoreHTML = `
      <div class="score vs">
        VS
      </div>
    `;

  }


  row.innerHTML = `

    <div class="match-time">
      ${timeText}
    </div>


    <div class="team home">

      <span class="team-name">
        ${escapeHtml(home?.name || "Home")}
      </span>

      ${
        home?.logo
        ? `<img
            class="team-logo"
            src="${escapeAttribute(home.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

    </div>


    ${scoreHTML}


    <div class="team away">

      ${
        away?.logo
        ? `<img
            class="team-logo"
            src="${escapeAttribute(away.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

      <span class="team-name">
        ${escapeHtml(away?.name || "Away")}
      </span>

    </div>


    <div class="arrow">
      ›
    </div>

  `;


  return row;

}


/* =========================
   LEAGUE SELECT
========================= */

function updateLeagueSelect() {

  const select =
    document.getElementById("leagueSelect");

  const currentValue =
    select.value;

  select.innerHTML = `
    <option value="all">
      ⚽ All Leagues
    </option>
  `;


  const leagues = {};

  allMatches.forEach(match => {

    const id =
      match.league?.id;

    if (!id) return;

    leagues[id] = {
      name:
        match.league?.name ||
        "Unknown League",
      country:
        match.league?.country ||
        ""
    };

  });


  Object.entries(leagues)
    .sort((a,b) =>
      a[1].name.localeCompare(
        b[1].name
      )
    )
    .forEach(([id, league]) => {

      const option =
        document.createElement("option");

      option.value = id;

      option.textContent =
        league.country
        ? `${league.name} - ${league.country}`
        : league.name;

      select.appendChild(option);

    });


  if (
    [...select.options]
      .some(option =>
        option.value === currentValue
      )
  ) {

    select.value =
      currentValue;

  }

}


/* =========================
   LEAGUES PAGE
========================= */

async function loadLeagues() {

  const status =
    document.getElementById(
      "leaguesStatus"
    );

  const list =
    document.getElementById(
      "leagueList"
    );


  if (leagueCache.length > 0) {

    renderLeagueList();

    return;

  }


  status.textContent =
    "Loading real leagues...";


  try {

    const response =
      await fetch(
        "https://football-livescore-backend.vercel.app/api/leagues"
      );

    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        "Unable to load leagues"
      );

    }


    leagueCache =
      data.response || [];


    renderLeagueList();


  } catch (error) {

    status.innerHTML = `
      <div class="error-message">
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


function renderLeagueList() {

  const status =
    document.getElementById(
      "leaguesStatus"
    );

  const list =
    document.getElementById(
      "leagueList"
    );


  status.style.display =
    "none";

  list.innerHTML = "";


  leagueCache.forEach(item => {

    const league =
      item.league;

    const country =
      item.country;


    if (!league) return;


    const div =
      document.createElement("div");

    div.className =
      "league-list-item";


    div.innerHTML = `

      ${
        league.logo
        ? `<img
            src="${escapeAttribute(league.logo)}"
            onerror="this.style.display='none'"
          >`
        : ""
      }

      <div>
        <strong>
          ${escapeHtml(league.name || "")}
        </strong>

        <br>

        <small>
          ${escapeHtml(country?.name || "")}
        </small>
      </div>

    `;


    list.appendChild(div);

  });

}


/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page, element) {

  document
    .querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );


  document
    .querySelectorAll(".nav-item")
    .forEach(n =>
      n.classList.remove("active")
    );


  if (page === "matches") {

    document
      .getElementById("matchesPage")
      .classList.add("active");

  }


  if (page === "leagues") {

    document
      .getElementById("leaguesPage")
      .classList.add("active");

    loadLeagues();

  }


  if (page === "news") {

    document
      .getElementById("newsPage")
      .classList.add("active");

  }


  element.classList.add("active");

}


/* =========================
   SEARCH
========================= */

function toggleSearch() {

  const box =
    document.getElementById(
      "searchBox"
    );

  box.classList.toggle("show");

  if (box.classList.contains("show")) {

    document
      .getElementById("searchInput")
      .focus();

  }

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START APP
========================= */

buildDateBar();

loadFixtures();

</script>

</body>
</html>
