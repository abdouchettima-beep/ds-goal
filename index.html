<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DS Goal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f8;
      color: #172b4d;
    }

    /* HEADER */
    header {
      background: #172f56;
      color: white;
      padding: 20px 15px;
      text-align: center;
      border-bottom: 4px solid #d9a900;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    header p {
      margin: 6px 0 0;
      color: #f2c94c;
      font-size: 14px;
    }

    /* MAIN CONTAINER */
    .container {
      padding: 15px;
      max-width: 700px;
      margin: auto;
    }

    /* STATUS */
    .status {
      text-align: center;
      padding: 14px;
      background: white;
      border-radius: 10px;
      margin-bottom: 15px;
      color: #172f56;
      font-weight: bold;
      border-left: 4px solid #d9a900;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* MATCH CARD */
    .match {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
      border-left: 4px solid #d9a900;
    }

    /* LEAGUE */
    .league {
      font-size: 14px;
      color: #172f56;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e1e4ea;
    }

    /* TEAMS */
    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .teams span:first-child,
    .teams span:last-child {
      width: 38%;
    }

    .teams span:first-child {
      text-align: left;
    }

    .teams span:last-child {
      text-align: right;
    }

    /* SCORE */
    .score {
      width: 24%;
      text-align: center;
      font-size: 22px;
      color: #d9a900;
      white-space: nowrap;
    }

    /* MATCH TIME */
    .time {
      text-align: center;
      margin-top: 12px;
      color: #c62828;
      font-weight: bold;
    }

    /* MOBILE */
    @media (max-width: 480px) {

      header h1 {
        font-size: 26px;
      }

      .container {
        padding: 10px;
      }

      .match {
        padding: 13px;
      }

      .teams {
        font-size: 14px;
      }

      .score {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ DS GOAL</h1>
  <p>Live Football Scores</p>
</header>

<div class="container">

  <div class="status" id="status">
    Loading live matches...
  </div>

  <div id="matches"></div>

</div>

<script>

const BACKEND_URL =
  "https://football-livescore-backend.vercel.app/api/football";


async function loadMatches() {

  const status = document.getElementById("status");
  const matches = document.getElementById("matches");

  try {

    const response = await fetch(BACKEND_URL);

    const data = await response.json();

    if (!data.response || data.response.length === 0) {

      status.textContent = "No live matches right now.";

      matches.innerHTML = "";

      return;
    }

    status.textContent =
      data.response.length + " live match(es)";

    matches.innerHTML = "";


    data.response.forEach(match => {

      const home =
        match.teams.home.name;

      const away =
        match.teams.away.name;

      const homeScore =
        match.goals.home ?? 0;

      const awayScore =
        match.goals.away ?? 0;

      const league =
        match.league.name;

      const elapsed =
        match.fixture.status.elapsed
          ? match.fixture.status.elapsed + "'"
          : "";


      matches.innerHTML += `

        <div class="match">

          <div class="league">
            ${league}
          </div>

          <div class="teams">

            <span>
              ${home}
            </span>

            <span class="score">
              ${homeScore} - ${awayScore}
            </span>

            <span>
              ${away}
            </span>

          </div>

          <div class="time">
            ${elapsed}
          </div>

        </div>

      `;

    });

  } catch (error) {

    status.textContent =
      "Unable to load live scores.";

    console.log(error);

  }

}


/* LOAD MATCHES */
loadMatches();


/* REFRESH EVERY 60 SECONDS */
setInterval(loadMatches, 60000);

</script>

</body>
</html>
